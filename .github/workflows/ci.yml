# Fleet CI caller — the workflow itself lives in vellum, pinned to a rev like
# every other vellum dependency; a bump PR moves this rev together with the
# pyproject pin. Jobs: pasm validate + scan (gates), fmt / clippy -D warnings /
# tests plus content validation and replay acceptance, Trunk web build, Pages
# deploy on main pushes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The deploy job inside fleet-ci needs pages + id-token; a called workflow can
# only narrow what the caller grants.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: jkeywo/vellum/.github/workflows/fleet-ci.yml@41d2e6274a7d0d0ddc1c0c0aca3db3cbd2760471
    with:
      # Bevy's audio/input need alsa/udev on ubuntu, and winit's Wayland
      # backend needs wayland/xkbcommon. The wasm job shares them for
      # host-compiled build scripts.
      apt-packages: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      extra-check-commands: |
        cargo run -p aeon_tools -- validate-content
        cargo run -p aeon_tools -- accept
      wasm-mode: trunk
      trunk-working-directory: crates/aeon_client
