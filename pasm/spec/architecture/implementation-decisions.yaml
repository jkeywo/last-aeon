        - obligations-are-specific-political-facts
        - mvp-hand-authored-scenario

  - decision: agency-intents-are-authored-on-jobs
    core:
      status: accepted
      confidence: confirmed
      title: Which Job Answers Which Pressure Is Authored Content
      summary: >-
        Autonomous houses score concrete pressures, then choose among jobs
        whose authored ai_intent declares that they answer that pressure.
        The simulation never names a piece of content, so a new job joins
        the AI's repertoire by declaring an intent. A house explains in the
        log why it acted on a pressure, while routine upkeep speaks through
        its results.
      rationale:
        - Hardcoding job keys in the engine would couple the simulation to a particular content set and break every fixture that authors its own jobs.
        - Explaining pressure-driven actions makes autonomous behaviour legible without exposing the roll that broke a tie as though it were certainty.
      references:
        - intent-driven-organisation-agency
        - ai-agency-through-the-job-catalogue
        - job-system

  - decision: egui-with-owned-design-tokens
    core:
      status: accepted
      confidence: confirmed
      title: egui Plus an Owned Design-Token Layer, Not an HTML Interface
      summary: >-
        The interface stays on egui, and its whole appearance moves into a
        serde token file the client embeds at build time. A designed token
        set replaces the authored one wholesale without touching rendering
        code. The alternative of defining the interface in HTML was
        investigated and rejected: wry is a native webview binding and
        cannot compile to wasm32, which is the target the game is actually
        played on; bevy_wry has been unmaintained since 2024 and
        bevy_webview_wry is pinned to an older Bevy. bevy_hui does support
        the current Bevy but ships no widgets at all, against an open engine
        limitation preventing a child node escaping its parent's clipping —
        which is exactly what tooltips and dropdowns need, and this
        interface is made of pervasive hover explanations, pickers, scroll
        areas and modal windows.

        The token set covers the whole appearance, not only colour: widget
        state surfaces, per-state stroke weights and hover expansion,
        button padding, shadows, scrollbars, menus, tooltips, sliders, the
        structural on/off choices, and the sizes of the parts the client
        draws by hand. Every token is read by something, and a test names
        each one and fails if changing it leaves the applied style
        identical. On native the file is also watched and re-applied on
        save, and a specimen panel renders every token in context, so the
        design loop is a save rather than a rebuild.
      rationale:
        - The web build is the primary playable surface, so an approach that cannot compile to wasm32 could never serve it whatever its merits natively.
        - Owning the token struct carries no migration risk and no dependency that can go stale, where the published egui theme crates are either abandoned or unverified against the egui version in use.
        - Tokens translate mechanically into egui's state-keyed style, so design work can be requested as a token file plus static mockups rather than as shipping code.
        - A token nothing reads is worse than no token, because it lies to whoever sets it; three had already gone bad unnoticed, including one that drew every plain label in the muted secondary colour, so the rule is enforced by a test rather than left as an intention.
        - Nothing is tokenised that egui cannot express — there is no disabled colour, because egui fades by alpha rather than carrying a disabled widget state, and no font family, because the build ships one face.
      references:
        - job-forecast-and-explanation-ui
        - context-sensitive-job-ui

  - decision: single-source-leader-availability
    core:
      status: accepted
      confidence: confirmed
      title: Exactly One Function Answers Whether a Character May Lead
      summary: >-
        leader_availability in the simulation is the only answer to whether
        a character can lead a job, and it returns the specific cause rather
        than a boolean. Being assigned a standing command is not a blocker
        in itself — a general may still lead a diplomatic job — so whether a
        commitment bars a particular job is asked per target. The client
        renders the returned cause and never re-derives eligibility.
      rationale:
        - Three partial implementations had drifted apart, which is what made busy characters appear selectable and then silently no-op on click.
        - A cause rather than a boolean is what lets the interface say why someone is unavailable and when they will be free, instead of omitting them and leaving the player to wonder where their household went.
      references:
        - context-sensitive-job-ui
        - job-system

  - decision: ship-captains-are-assigned-and-consequential
    core:
      status: accepted
      confidence: confirmed
      title: Ships Are Commanded by Assigned Captains
      summary: >-
        A ship's captain and optional first officer are physical posts aboard
        the vessel. They may be appointed remotely, but the timed appointment
        completes only when the candidate reaches and boards the ship; the
        incumbent remains captain until then. An aboard first officer succeeds
        a vacant captain immediately and seamlessly, preserving active orders.
        A replaced captain fills an open first-officer post unless already
        given another validated active or queued assignment. A commanded ship
        may receive ordinary orders and its captain scales what it achieves.
        A ship with neither captain nor promotable first officer accepts no
        ordinary orders and retreats automatically at half speed. It chooses
        the closest reachable starport by fastest route and stable-ID tie-break:
        first its owner's ports, then one hierarchy level at a time above its
        owner, then ports whose owner's head has positive opinion of the
        ship-owner's head. Within each tier, route time and then stable ID choose
        the destination. The chosen
        destination remains unless invalid or unreachable; an already docked
        ship stays at any acceptable port. If none qualifies, it stays where it
        is. Passengers, cargo, and an embarked army remain aboard. A new captain
        ends the retreat immediately without losing route progress.
      rationale:
        - The field existed but was inert, so the interface papered over a missing captain by falling back to the house head, which meant ordering a ship nobody was commanding.
        - Giving the post mechanical weight makes assigning it a decision rather than a formality, and matches how armies already work.
      references:
        - job-system
        - job-based-operational-warfare

  - decision: armies-use-general-and-lieutenant-command-succession
    core:
      status: accepted
      confidence: confirmed
      title: Armies Use Generals and Lieutenants Like Ships Use Captains and First Officers
      summary: >-
        An army's general and optional Lieutenant follow the same physical,
        timed appointment, incumbent replacement, automatic promotion, order
        preservation, and displaced-commander rules as a ship's captain and
        first officer. An army with neither general nor promotable Lieutenant
        accepts no ordinary orders and retreats at half speed toward the closest
        acceptable province using the same owner, hierarchy, positive-opinion,
        route-time, and deterministic tie-break rules used for ship refuges. It
        cannot arrange new interworld transport while leaderless. If already
        embarked, it remains aboard and defers its own retreat until the carrying
        ship docks and legal disembarkation is possible.
      rationale:
        - Parallel command rules make leadership loss predictable across persistent forces while named subordinate officers turn succession into preparation rather than a special-case rescue action.
      references:
        - ship-captains-are-assigned-and-consequential
        - persistent-armies
        - physical-presence-and-order-delay

  - decision: armies-embark-whole-against-authored-troop-capacity
    core:
      status: accepted
      confidence: confirmed
      title: One Whole Army Embarks Against Authored Troop Capacity
      summary: >-
        A persistent owned ship may carry one army when its authored troop
        capacity is at least the army's current manpower. Supplies and equipment
        are included rather than counted separately. An army is never split
        implicitly, and authored army sizes and capacity bands align to keep the
        fit legible. Embarkation requires army and ship together at an authored
        starport and brings the general aboard; ordinary disembarkation is a
        timed assignment at a starport. Future specialised assault landings may
        target non-starport provinces through distinct ships, risks, and
        opposition rules.
      rationale:
        - Whole-army capacity makes transport a strategic constraint without turning embarkation into packing arithmetic.
      references:
        - authored-routes-and-physical-personal-transport
        - persistent-armies
        - tracked-starships

  - decision: all-delayed-assignments-share-en-route-feedback
    core:
      status: accepted
      confidence: confirmed
      title: Every Delayed Assignment Appears En Route
      summary: >-
        Every validated delayed assignment order appears in the same en-route
        projection with its execution date and target, whether it was launched
        from an ordinary inspector action or from a Situation action.
      rationale:
        - The launch surface must not change the visibility of an otherwise identical authoritative order.
      references:
        - job-forecast-and-explanation-ui
        - situation-system

  - decision: hop-distance-answers-realm-questions
    core:
      status: accepted
      confidence: confirmed
      title: Realm Questions Are Answered by Hop Distance, Not Top of Chain
      summary: >-
        Whether a province answers to a house is asked as a hop count
        through the liege chain, in the simulation rather than the client.
        Walking to the top of the chain answers a different question and is
        wrong for any house that is itself a vassal.
      rationale:
        - The player's own house is a vassal, so a top-of-chain walk attributed its holdings to its liege and showed the player none of their own realm.
        - Living in the simulation makes it testable against the real scenario rather than only against whatever the client happens to render.
      references:
        - strategic-map-intelligence-modes
        - title-based-territorial-politics

  - decision: painter-drawn-ui-icons
    core:
      status: accepted
      confidence: confirmed
      title: Interface Icons Are Drawn From Primitives
      summary: >-
        Icons are drawn as painter shapes inside a unit square, scaled to
        whatever rect they are given. The client ships no image assets and
        the egui integration requires textures to be registered before use,
        so an icon set made of files would add a loading path, a
        registration step and a wasm packaging concern. Font glyphs were
        rejected because coverage varies by platform and a missing glyph is
        a silent box rather than a build error.
      rationale:
        - Primitive shapes are resolution-independent, tinted by the theme like every other element, and identical on both targets.
        - Shapes are chosen to differ in silhouette rather than in detail, because at toolbar size the outline is what is actually read.
      references:
        - strategic-map-intelligence-modes
        - egui-with-owned-design-tokens

  - decision: world-read-access-module
    core:
      status: accepted
      confidence: confirmed
      title: One Module Answers World-Read Questions
      summary: >-
        The simulation crate has a single access module that answers
        "give me this entity's record": records and entities by stable
        ID, display names, the Consul and the Sanctora, stable-ID-ordered
        ID collections, message-log date stamping, and campaign-seed
        stream derivation. Systems no longer open-code the index-entity-
        component walk, private display-name resolvers, or their own
        seed fetching.
      rationale:
        - Every open-coded copy of these walks was a place the stable-ID-iteration and derived-stream rules could be silently broken; concentrating them makes the determinism discipline reviewable in one file.
        - The migration was verified behaviour-identical by bit-equal acceptance hashes before and after, so the refactor carries no replay risk.
      references:
        - stable-id-ordered-iteration
        - hand-rolled-deterministic-rng
        - deterministic-campaign-simulation

  - decision: map-facts-are-simulation-answers
    core:
      status: accepted
      confidence: confirmed
      title: The Map's Political Facts Are Simulation Answers
      summary: >-
        Every political fact a map mode colours by is a simulation
        function, tested against the real scenario: province holders come
        from province_holder, great-house realms from great_house_of,
        garrison strength from garrison_in (counted in stable-ID order),
        and claimant standing from the same personal-claim registry,
        transitive realm totals, and strict-dominance predicate used by the
        press assignment. War hostility, sides, and operations likewise come
        from the formal-war ledger rather than proximity heuristics. The
        interface's leader gating goes back through leader_availability,
        which the client had drifted into re-deriving.
      rationale:
        - The client must depict the same claimant, realm, and war answers that authoritative assignment validation will enforce.
        - The re-derived leader gate was the exact bug class the single-source-leader-availability decision was written against; it had grown back within two milestones, which is why the predicate now lives nowhere but the simulation.
      references:
        - single-source-leader-availability
        - hop-distance-answers-realm-questions
        - strategic-map-intelligence-modes
        - world-read-access-module

  - decision: builder-schema-is-the-reads
    core:
      status: accepted
      confidence: confirmed
      title: A Definition's Schema Is Stated Once, as Its Reads
      summary: >-
        The content host is three modules — the sandbox and orchestration,
        the define_* builders, and the cross-reference validation pass —
        instead of one 2,400-line file. Each builder reads its fields
        through a tracked reader: the reads themselves are the schema, the
        unknown-field warning is computed from what was actually read (so
        the old hand-maintained allow-lists are gone and cannot drift),
        and vocabulary fields are read against a spelling table whose
        error message lists every valid option. Individual validation
        branches are unit-tested through a minimal political fixture
        rather than only through whole-scenario loads.
      rationale:
        - Every definition's field names were typed twice within twenty lines (the allow-list and the reads) and nothing but review kept them equal; deriving the warning from the reads removes the second statement entirely.
        - Wrong-typed optional fields (an integer weighty, a map family) used to be silently coerced to their defaults; a schema stated as reads makes them loud, which is the same honesty the effect boundary already has.
      references:
        - content-defined-by-builder-calls
        - validated-declarative-game-data
        - boundary-vocabularies-parsed-once

  - decision: restore-mirrors-capture
    core:
      status: accepted
      confidence: confirmed
      title: A Full Restore Reads at One Seam, Mirroring Capture
      summary: >-
        capture_state has always listed every persisted section in one
        place; restore now does too. restore_state installs the
        content-free half (identity, clock, allocator, command pipeline,
        obligations, events) and restore_content_state respawns the
        content-bound half (map, politics, forces, jobs, script runtime,
        content database) in the same order start_campaign_with_content
        creates it. The host composes the pair instead of finishing the
        restore itself with knowledge the snapshot module did not state.
      rationale:
        - Which sections restore where used to be split across two files and asymmetric with capture; a new persisted section could be captured but silently never restored, caught only by the acceptance replay.
        - Naming the two halves makes the content-free/content-bound boundary — which already governed obligations and events — an explicit rule rather than an accident of where code accumulated.
      references:
        - versioned-snapshots-plus-command-log
        - content-hash-binds-saves-to-content
        - campaign-persistence

  - decision: decisions-are-pure-application-is-separate
    core:
      status: accepted
      confidence: confirmed
      title: Random Decisions Are Pure Functions; Application Is Separate
      summary: >-
        Wherever a derived stream settles an outcome, the decision is a
        pure function of explicit inputs and the stream, separate from the
        world mutation that applies it. Job outcomes are drawn by
        forecast::resolve_outcome — the same module that reports the odds,
        so the roll obeys the forecast by construction rather than by two
        hand-written samplers agreeing. Field engagements are decided by
        decide_engagement over gathered EngagementInputs, and autonomous
        houses pick from their shortlist through pick_intent. Each
        consumes a fixed number of rolls, and each is unit-tested —
        including a statistical test that the sampler's empirical
        frequencies match result_odds.
      rationale:
        - The forecast promised the roll would use exactly the table shown to the player, but the sampler was a second hand-rolled implementation buried in a &mut World monolith with no test able to hold the two together.
        - A decision that is pure in its inputs and stream can be tested across thousands of seeds without running campaign ticks, which is where formula bugs actually get caught.
      references:
        - forecasts-derive-from-shared-resolution-code
        - job-forecasts-share-authoritative-calculations
        - strategic-engagement-formula
        - agency-intents-are-authored-on-jobs

  - decision: boundary-vocabularies-parsed-once
    core:
      status: accepted
      confidence: confirmed
      title: Script Boundary Vocabularies Are Typed, and Parsed Exactly Once
      summary: >-
        The vocabularies authored content shares with the simulation — the
        seven effect roles (leader, target, target-head, owner-head,
        liege-head, consul, sanctora) and the obligation kinds (favour,
        promise, grievance) — are enums in the content crate, parsed once
        where the content enters (define_* conversion and effect parsing)
        and typed everywhere after. A mistyped role or kind is a loud
        parse error, never a silent no-op or a defensive fallback. One
        resolver (JobRoles::resolve) answers who stands behind each role
        for jobs, popup choices, and events alike, and every effect
        function receives one documented context schema (source, result,
        leader, target) regardless of what invoked it.
      rationale:
        - The role vocabulary had one producer, three consumers, and no type; events had already drifted to filling only half the roles, and a typo'd role addressed nobody without a word of complaint.
        - Parsing at the boundary is the only place the whole vocabulary is visible at once, which is what makes the error message able to spell out every valid spelling.
      references:
        - effects-returned-not-emitted
        - scripts-emit-validated-effects-only
        - job-effect-roles

  - decision: non-modal-character-picker
    core:
      status: accepted
      confidence: confirmed
      title: The Character Picker Is a Workspace, Not a Modal
      summary: >-
        Choosing who leads an action happens in one non-modal window that
        stays open when a candidate is selected. Candidates carry their
        whole forecast rather than a summary of it, so the breakdown shown
        while comparing is the object that will resolve the job. Those who
        cannot take the job on are listed below a divider with the
        simulation's own account of where they are; when nobody is free the
        empty state names the soonest date one comes free.
      rationale:
        - Choosing a leader is comparison work, and a window that closes on selection forces the comparison to be restarted for every candidate considered.
        - Carrying the forecast rather than a summary means the figure compared on cannot drift from the figure committed to, which is the same guarantee the forecast system already makes for the expanded action.
        - An empty list that explains itself and names a date turns waiting into a decision rather than a guess.
      references:
        - forecasts-derive-from-shared-resolution-code
        - single-source-leader-availability
        - context-sensitive-job-ui

  - decision: display-text-lives-in-one-string-table
    core:
      status: accepted
      confidence: confirmed
      title: Every Player-Facing String Lives in One Table
      summary: >-
        No display text is written in Rust or in authored Rhai. One CSV
        holds every string the player reads, each row carrying an ID, the
        context whoever translates it needs, and the English text. Content
        rows are keyed by derivation from the definition's own ID —
        province.karvessa.name, event.grain-riot.log-text — so a definition
        cannot point at the wrong row and a renamed definition either takes
        its prose with it or fails to load. Interface and simulation rows
        are keyed by hand under ui. and sim. prefixes. The table is
        embedded at build time and inserted by the simulation plugin, so a
        world restored from a snapshot has it for the same reason a fresh
        one does; it is not campaign state and is not snapshotted.
      rationale:
        - Translation needs one data source with stable IDs, and code is not one.
        - Deriving a definition's key from its ID removes the second place the two could disagree, which an authored key field would reintroduce.
        - Resolving simulation log lines as they are written keeps LogEntry a plain string, leaving the snapshot format, state hashing, and the client's log filter untouched. A save records the language it was played in, which is the price of that and is worth paying until a second language exists.
        - Pluralised strings are two whole rows selected on the count rather than a sentence assembled from fragments, so word order stays the translator's to choose.
        - Enums whose variants the player reads return keys rather than English, which turns "this variant has no label" from an invisible gap into a failing test.
      references:
        - content-ids-are-kebab-case-strings
        - client-embeds-content-at-build-time
        - validated-declarative-game-data

  - decision: unapproved-prose-is-bracketed-in-the-data
    core:
      status: accepted
      confidence: confirmed
      title: Unapproved Prose Is Bracketed in the Data
      summary: >-
        English that no human has yet approved is wrapped in square
        brackets in the table itself, not flagged by a column or decorated
        at runtime. Approving a line is the act of deleting its brackets.
        The loader reports how many rows remain bracketed, so the figure is
        visible on every validate run.
      rationale:
        - Almost all the prose was drafted mechanically, and the brackets make that legible on screen rather than hiding it in a manifest a reader has to go and consult.
        - Brackets in the data mean the placeholder state survives every path the text takes — panels, logs, popups, tooltips — without any code knowing about it.
        - Approval becomes a one-character edit in the file being read, which is the smallest possible ceremony for the act that matters most.
      references:
        - display-text-lives-in-one-string-table

  - decision: surface-positions-are-directions-not-points
    core:
      status: accepted
      confidence: confirmed
      title: A Body's Surface Is Addressed by Direction, Not by World Position
      summary: >-
        Every place on a body is held as a unit direction derived from its
        authored latitude and longitude, never as a rendered position. One
        projection type turns a direction into a world point, turns a world
        point back into a direction, and answers whether a place faces the
        camera. Mesh, labels, selection pin and click targets all ask it,
        so the globe and the flat map are the same map drawn two ways
        rather than two maps kept in step.
      rationale:
        - Placing and un-placing are inverses, and are tested as such, because a projection that drew a province somewhere it could not be clicked would be worse than offering no second projection at all.
        - The baked political texture is equirectangular in latitude and longitude, which is what a sphere's UVs and a plane's UVs both ask for, so one bake serves both meshes and no second texture pipeline exists.
        - A flat map needs only four vertices, since an equirectangular texture maps linearly across a plane, where the sphere needs a grid to curve between the same UVs.
        - "Back-face culling belongs to the projection rather than to the label renderer: a globe hides half its surface and a flat map hides nothing, and that is a fact about the projection."
      references:
        - strategic-map-intelligence-modes
        - painter-drawn-ui-icons

  - decision: rng-stream-labels-are-identities-not-names
    core:
      status: accepted
      confidence: confirmed
      title: A Random Stream's Purpose Label Is an Identity, Not a Name
      summary: >-
        Every derived random stream is keyed by the campaign seed, a short
        purpose label, and the acting entity's stable id. The label is
        hashed into the stream, so it identifies the stream rather than
        describing it: changing one re-rolls every outcome it has ever
        produced. Labels are therefore frozen once written, even when the
        concept they refer to is renamed around them, and the call sites
        and the RNG's own documentation say so.
      rationale:
        - Renaming the concept from Job to Assignment renamed the resolution stream's label with it, and 900 simulated days came out different — houses honoured debts they had previously repudiated. Nothing but a name had been touched.
        - A label that reads like prose invites exactly this, so the reason is recorded where the temptation is rather than in a document nobody opens mid-refactor.
        - "Nothing is lost by keeping an old spelling: the label is never shown to a player and its only job is to be stable."
      references:
        - deterministic-seed-and-command-replay
        - hand-rolled-deterministic-rng

  - decision: assignments-declare-who-they-may-target
    core:
      status: accepted
      confidence: confirmed
      title: An Assignment Declares Who It May Be Aimed At
      summary: >-
        Assignments carry an authored requirements block — whose the
        province is, whether a hostile force is present, whose house the
        target belongs to, what title they hold, whether they owe a favour,
        whether the owner is under threat at all — in the same shape events
        have used since M2.3. It is evaluated in exactly one place, so the
        button, the forecast, an autonomous house and a standing order
        cannot disagree about what is legal. Every field defaults to "do
        not care", so an assignment that declares nothing keeps the reach
        it had.
      rationale:
        - The previous check asked only whether the target existed, so a province was a legal raid target because it was a province — which is how raiding your own holdings and answering an alarm that was not sounding came to be on the menu.
        - The only relational rule that did exist was a content key spelled out in the client with its own title check, which is precisely what agency-intents-are-authored-on-jobs forbids; making the rule authored deletes it.
        - Defaulting to "do not care" is what allows the gate to be added without silently narrowing every piece of content nobody revisited.
      references:
        - agency-intents-are-authored-on-jobs
        - single-source-leader-availability
        - validated-declarative-game-data

  - decision: orders-live-under-the-thing-ordered
    core:
      status: accepted
      confidence: confirmed
      title: An Order Is Offered Under the Thing Being Ordered
      summary: >-
        Armies and ships are selectable and have inspectors, and their
        assignments are offered there. A province offers what can be done
        to ground. A destination is a slot in the order rather than a
        reason to file the order under geography.
      rationale:
        - Every force assignment was offered under the province, because forces were not selectable at all — so marching read as something done to a province rather than something told to an army.
        - The rules that the old province-scoped plumbing carried — an army is commanded by its general, a ship by its captain, neither substitutable — outlived it and keep a home of their own where they remain testable.
      references:
        - context-sensitive-job-ui
        - ship-captains-are-assigned-and-consequential

  - decision: assignments-have-authored-phases
    core:
      status: accepted
      confidence: confirmed
      title: Assignments Run Through Phases, and Some Cannot Be Called Off
      summary: >-
        An assignment authors an ordered list of phases, each with a length
        and whether it can be interrupted, and what being called off during
        it costs. An assignment that authors none gets a single
        interruptible phase covering its duration, which is exactly how
        assignments behaved before. Duration is checked against the sum of
        the phases at load rather than believed. A cancellation asked for
        during a committed phase is recorded and honoured when the phase
        ends.
      rationale:
        - An assignment that could be cancelled at any moment with no cost made committing to one not a decision.
        - Being turned back on the road is not the same as abandoning a siege, so what an interruption costs is authored per phase rather than once.
        - Recording a cancellation rather than refusing it matters because a click that appears to do nothing is indistinguishable from one that was not registered.
        - "The point of no return is on the definition so the interface can show it before the player commits: a deadline they cannot see is not a decision they get to make."
      references:
        - job-forecast-and-explanation-ui
        - validated-declarative-game-data

  - decision: standing-orders-are-priority-lists
    core:
      status: accepted
      confidence: confirmed
      title: A Standing Order Is an Ordered List of Assignments
      summary: >-
        A force holds an ordered list of assignments it may start on its
        own; each day it starts the first whose authored requirements are
        satisfied, through the same validation a player's order takes. The
        interface offers the list by asking the content what that kind of
        force can do, so neither the engine nor the client names an
        assignment.
      rationale:
        - The previous form was two variants with the defending behaviour hardcoded down to the content key of the assignment it started — the last content key compiled into the simulation.
        - "Sharing the authored requirements is the guarantee worth having: a force can never do unbidden what its owner could not have ordered by hand."
        - New behaviour becomes authored rather than compiled, and the order a force reaches for things in becomes a decision the player can make.
      references:
        - assignments-declare-who-they-may-target
        - agency-intents-are-authored-on-jobs
        - job-based-operational-warfare

  - decision: households-act-within-their-own-means
    core:
      status: accepted
      confidence: confirmed
      title: An Idle Household Member Acts, but Never Spends
      summary: >-
        A member of a house with no assignment picks one up unbidden,
        provided it costs the house nothing in wealth, manpower, supplies
        or influence. Anything that spends waits for the person whose
        stores they are. Every such start goes through the same validation
        a player's order takes, and candidates are walked in stable id
        order. Assignments carry a coarse three-level urgency, read only by
        what may be picked up and what may interrupt what.
      rationale:
        - A household that stood still until told was the larger fault, but a household that quietly drains the treasury while the player is looking elsewhere is worse; costing nothing is the narrowest leash that fixes the first without causing the second.
        - Urgency is deliberately coarse because a finer scale would invite tuning that no player could perceive.
        - This is the household acting within a house, a different level from whole houses acting through intent-driven agency, which it leaves untouched.
      references:
        - intent-driven-organisation-agency
        - single-source-leader-availability

  - decision: plans-are-data-not-script
    core:
      status: accepted
      confidence: confirmed
      title: A Plan Is Data All the Way Down
      summary: >-
        define_plan declares a goal from the shared intent vocabulary,
        methods gated by declarative integer conditions, and ordered steps
        naming assignments or sub-plans. Loading validates every key,
        target compatibility, and acyclic sub-plan composition no deeper
        than three; nothing about a plan is script. Conditions evaluate
        over visible state and replay identically.
      rationale:
        - Conditions as data validate at load and can be shown to the player as reasons; a scripted condition can do neither and is a determinism risk besides.
        - A step field is spelled 'start' rather than 'do' because 'do' is a reserved word in Rhai; recorded so nobody "fixes" it back.
      references:
        - agency-intents-are-authored-on-jobs
        - plans-are-authored-campaigns
        - content-ids-are-kebab-case-strings

  - decision: plan-steps-bypass-ai-available-not-validation
    core:
      status: accepted
      confidence: confirmed
      title: Plan Steps Bypass ai_available, Never validate_start
      summary: >-
        A plan step may name an assignment the reactive scorer cannot
        reach, because ai_available gates the scorer's monthly repertoire
        and nothing else. What a step can never bypass is validate_start,
        which every start still passes.
      rationale:
        - A campaign may deliberately call for assignments the scorer must not reach for on a whim, muster being the standing example; the guarantee worth keeping is the gate, not the flag.
      references:
        - plans-are-authored-campaigns
        - standing-orders-are-priority-lists
    evidence:
      - kind: test
        reference: crates/aeon_sim/tests/plans.rs
        summary: >-
          The peace plan's first step is an ai_available:false assignment
          and starts anyway; every step still passes validate_start, the
          same guarantee standing orders live under.

  - decision: plans-live-in-one-resource
    core:
      status: accepted
      confidence: confirmed
      title: Plan State Is One Resource, Snapshot Section Like Any Other
      summary: >-
        Active plans and cooldowns live in a single resource of BTreeMaps
        keyed by character, serialised into the campaign snapshot
        (format v11) beside obligations and events. Steps are flattened at
        adoption — sub-plans expand then, by first eligible method — so a
        running plan never consults another definition. Abandonment plus
        cooldown is the entire failure policy; there is no replanning
        search, and max_days is the single safety valve for a blocked step.
      rationale:
        - Plans are consulted by stable character id from several systems; BTreeMaps give the iteration order determinism requires for free.
        - One legible safety valve beats a second per-step policy nobody can reason about; a house that still wants the goal adopts afresh after the cooldown, visibly.
      references:
        - plans-are-authored-campaigns
        - characters-are-the-acting-unit
        - rng-stream-labels-are-identities-not-names

  - decision: goals-are-a-lens-over-scoring
    core:
      status: accepted
      confidence: confirmed
      title: A Goal Steers by Biasing Scoring, Not by Executing
      summary: >-
        A grand-strategy goal adds no executor. While a house holds one, it
        lifts the pressures the goal favours in the head's own scoring, so
        the reactive scorer, the plans, and the assignments already in
        place carry the ambition out. The goal lives in a resource keyed by
        the organisation rather than the character, so it outlives the
        succession that ends a plan; it ends when its rival falls, its
        house falls, or its horizon passes.
      rationale:
        - A second execution engine above plans would double the ways a house can act and the places behaviour can diverge; a bias over the one scorer keeps a single path from pressure to deed.
        - An ambition that spans reigns belongs to the house, not the person, which is why goals key by organisation while plans key by character.
      references:
        - grand-strategy-goals
        - plans-are-authored-campaigns
        - characters-are-the-acting-unit
        - rng-stream-labels-are-identities-not-names

  - decision: directives-are-derived-not-stored
    core:
      status: accepted
      confidence: confirmed
      title: A Goal's Directives Are Derived, Not Stored
      summary: >-
        A directive pressed by a liege's ambition is read straight off goal
        state through one function, directives_on, rather than kept in a
        record of its own. It therefore exists exactly while the liege
        holds the goal that presses it, cannot drift after a restore, and
        lapses for free when the goal ends. Only a directive issued by hand
        — which has no goal behind it — is stored, in IssuedDirectives, and
        the same function merges the two so the scorer and the interface
        read one source. A directive is advisory: it lifts a pressure in
        the vassal head's scoring and never compels.
      rationale:
        - Storing what can be derived invites the store and the source to disagree; deriving the goal's directives removes a snapshot section and a whole class of drift.
        - A hand-issued directive is the exception that must be stored precisely because no goal stands behind it to derive it from.
      references:
        - grand-strategy-goals
        - goals-are-a-lens-over-scoring
        - organisation-agency-model

  - decision: directives-authorised-by-the-chain-of-command
    core:
      status: accepted
      confidence: confirmed
      title: A Directive Is Authorised by the Chain of Command
      summary: >-
        IssueDirective and ClearDirective are the first player commands
        authorised by hierarchy rather than ownership: the player may press
        a directive on a house that answers directly to them —
        answers_to == Some(1) — and on no other, re-checked at apply time
        like every command. What the player may ask of a vassal is exactly
        what the vassal could choose, so the advisory rule holds in both
        directions, and the interface shows the player both the wish their
        liege presses on them and the wish they press on a vassal.
      rationale:
        - Every prior command validated against the player's own organisation; directing a vassal is a genuinely new authority, and the hierarchy — not ownership — is what grants it.
        - "Advisory in both directions keeps the guarantee that a house acts only through its head — neither a liege nor the player can compel a vassal to do what it could not have chosen."
      references:
        - grand-strategy-goals
        - directives-are-derived-not-stored
        - player-organisation
        - single-source-leader-availability

  - decision: goods-balance-is-derived-not-stored
    core:
      status: accepted
      confidence: confirmed
      title: A World's Goods Balance Is Derived, Not Stored
      summary: >-
        A body's net balance in each good — production less consumption
        across its provinces, plus what its buildings add and its routes
        carry in — is recomputed whenever it is read, never kept in a
        buffer. Production and consumption are content; buildings and trade
        routes are already-persisted state; so the balance follows from
        state that exists and needs no store of its own. A world in want
        reuses the order system's existing privation rather than adding a
        new arithmetic kind; a surplus sells and splits among the world's
        held provinces.
      rationale:
        - A stored balance invites the store and its sources to disagree; deriving it keeps one truth and removes a snapshot section and a reconciliation step.
        - Reusing the order privation for a goods shortfall means a hungry world behaves like a supply-starved one, which the player already understands.
      references:
        - the-goods-economy
        - provincial-order-system
        - plans-live-in-one-resource

  - decision: trade-crosses-worlds-only-by-ship
    core:
      status: accepted
      confidence: confirmed
      title: Goods Net Within a World, but Cross the Gulf Only by Ship
      summary: >-
        Goods flow freely within a body but do not net between bodies:
        a hungry world is answered only by a transport plying a standing
        route to it, the ship's counterpart to an army's standing orders.
        A running route brings its capacity of the good each month and
        earns its carrier the margin on what it sells into scarcity; a
        blockade at either dock cuts the line. The route is ship state, so
        it persists with the ship, and its relief is derived like the rest
        of the balance. The transport shuttles its docks through the
        transit machinery ships already have.
      rationale:
        - Making distance matter — a surplus on one world cannot answer a want on another without a carrier — is what turns tracked starships and idle transports into an economy rather than flavour.
        - Interdicting trade by blockade layers a lever of war onto a system that already halves a blockaded province's wealth.
      references:
        - the-goods-economy
        - tracked-starships
        - job-based-operational-warfare

  - decision: harm-reuses-one-condition-effect
    core:
      status: accepted
      confidence: confirmed
      title: Target-Directed Harm Is One Effect Over the Existing Machinery
      summary: >-
        The whole of the shadows rests on a single engine addition: an
        effect that resolves a named role and lays a condition on it,
        calling the very apply_risk that has always struck a failed leader.
        The tag fixes how long the harm lasts, so the effect carries no
        duration of its own, and a harmed target is barred from leading by
        the same machinery an injured leader is. Assassination, abduction,
        and sabotage are then authored content on that one seam; wrecking a
        building is the one further effect, and it leans on the economy of
        Milestone 9 for something to break.
      rationale:
        - Harm was already modelled — injury, capture, incapacity, scandal, death — and had only ever been aimed at the actor; letting content aim it elsewhere is a smaller and safer change than a parallel harm system.
        - Reusing apply_risk means a character felled by a scheme recovers, or does not, exactly as one felled by a failed job, so there is one truth about conditions.
      references:
        - the-shadows
        - character-simulation-scope
        - the-goods-economy

  - decision: the-ai-schemes-through-plans-not-the-scorer
    core:
      status: accepted
      confidence: confirmed
      title: A House Schemes Through Its Plans, Not on a Whim
      summary: >-
        The murderous work is ai_available:false: the reactive scorer that
        answers a month's heaviest pressure never reaches for it. A house
        comes to the knife only through the plans and goals of Milestone 8
        — a plan step that aims an assassination at the head of the plan's
        target organisation, through a target selector grown for exactly
        that. So a house answering a grievance may answer it in blood, and
        a grand ambition may remove the person who blocks it, but no house
        murders as ordinary business.
      rationale:
        - Making the scorer reach for assassination would have houses killing over routine pressures; gating it behind deliberate, authored plans keeps intrigue rare and motivated.
        - The plan target vocabulary grew by one selector — the target's head — exactly the demonstrated need, no more.
      references:
        - the-shadows
        - plans-are-authored-campaigns
        - grand-strategy-goals
        - agency-intents-are-authored-on-jobs

  - decision: fleet-foundation-adoption
    core:
      status: accepted
      confidence: confirmed
      title: The Fleet Foundation Replaces the In-Crate Twins, Breaking Saves Once
      summary: >-
        Three vellum crates replaced in-crate implementations under the
        fleet's rng-unification-breaks-saves decision. The RNG became the
        fleet PCG32 construction — the derived-streams pattern survives
        unchanged, with purpose labels and subjects folding into the stream
        selector, but the generator underneath is no longer xoshiro256** —
        and the golden-value tests were re-pinned once, deliberately. The
        state hash became the fleet FNV-1a digest, dropping sha2 from the
        wasm build: it is a determinism fingerprint, not a security
        boundary, and a pre-migration 64-character digest no longer even
        parses. The string table's CSV reader and placeholder interpolation
        became vellum-strings, adopting the fleet semantics that an
        unfilled placeholder stays visible in release rather than crashing
        the client. SNAPSHOT_FORMAT_VERSION bumped to 17 so every earlier
        campaign is refused rather than misread; the acceptance round-trip
        reproduces the final state exactly under the new construction.
      rationale:
        - >-
          vellum-corpus is deliberately not adopted: the acceptance check is
          one deterministic snapshot-replay round-trip, not a seeded batch,
          and driving a single case through a batch driver adds machinery
          without evidence. A multi-seed acceptance batch is the natural
          corpus consumer here if one is ever wanted.
      references:
        - deterministic-campaign-simulation
        - hand-rolled-deterministic-rng
        - rng-stream-labels-are-identities-not-names

  - decision: situations-project-live-facts-into-authored-context
    core:
      status: accepted
      confidence: confirmed
      title: Situations Query a Shared Semantic World View
      summary: >-
        A Situation definition contains pure trigger, projection, and outcome
        functions. Each receives its authored source and the same read-only
        semantic world interface available to every Rhai script, then returns
        typed instance bindings or fixed presentation blocks. The interface
        exposes stable game concepts rather than raw Bevy components, and this
        change implements the minimum deterministic, sorted views required for
        characters, organisations and lieges, titles, provinces, forces,
        opinions, obligations, assignments, Consular contests, Paramount
        claims and realm totals, and formal wars.
      rationale:
        - A generic semantic query surface lets authored triggers combine arbitrary supported simulation facts without hard-coding title, obligation, or war Situation categories.
        - Stable domain records preserve the scripting boundary and deterministic ordering while allowing the ECS representation to change independently.
        - Existing Rhai effect scripts receive the interface without needing to use it or change their current function bodies.
      references:
        - situation-system
        - situations-are-authored-shells-over-simulation-facts
        - deterministic-campaign-simulation
        - scripts-emit-validated-effects-only
        - world-read-access-module

  - decision: situation-instances-have-structural-identity
    core:
      status: accepted
      confidence: confirmed
      title: Situation Instances Have Structural Identity and Derived Stages
      summary: >-
        A Situation trigger returns zero or more binding maps in stable order.
        An instance key is its definition key plus its ordered typed subject
        bindings, allowing one definition to represent many simultaneous
        conflicts. The snapshot stores only that key, bindings, and activation
        date for active instances; stage, metrics, warnings, visibility, links,
        and actions are freshly projected from authoritative facts. Definitions
        may request an activation log entry, defaulting false; Formal War turns
        it on so declarations enter permanent tagged history.
      rationale:
        - Structural keys make a reusable definition deterministic without allocating content-specific identities.
        - Derived stages cannot drift from the title, obligation, contest, claim, assignment, or war state they explain.
        - "[ai] Labeled participant groups keep role-specific presentation authored and generic while preserving deterministic semantic links."
      references:
        - situation-system
        - situations-project-live-facts-into-authored-context
        - stable-game-identity
        - stable-id-ordered-iteration

  - decision: situation-lifecycle-leaves-dismissible-resolutions
    core:
      status: accepted
      confidence: confirmed
      title: Situation Lifecycles Leave Dismissible Resolutions
      summary: >-
        Situations evaluate once at campaign creation or restore and at the
        fully settled end of every day after daily, monthly, and yearly work.
        A newly returned key activates; an existing key retains its activation
        date; and a missing key freezes the first matching authored outcome or
        mandatory fallback into a resolution card. Resolutions persist across
        save and reload until a logged DismissSituationResolution command
        names their monotonic notice ID. Reactivation is a new lifecycle even
        when an older resolution card remains.
      rationale:
        - Persistent resolutions let the player learn what happened without pausing time or losing the answer between sessions.
        - End-of-day evaluation observes one settled authoritative state rather than exposing scheduler internals as visible stage flicker.
        - "[ai] A monotonic notice ID distinguishes recurring instances whose structural key is intentionally reused."
      references:
        - situation-instances-have-structural-identity
        - campaign-time-model
        - versioned-snapshots-plus-command-log
        - deterministic-seed-and-command-replay

  - decision: situation-actions-launch-authoritative-assignments
    core:
      status: accepted
      confidence: confirmed
      title: Situation Actions Launch Existing Assignment Flows
      summary: >-
        Rhai may offer typed actions but cannot mutate simulation state. For the
        initial deck every gameplay action opens an existing assignment flow
        with its subject and optional Situation or War identity preselected.
        The client keeps unavailable actions visible with the authoritative
        forecast reason. Assignments launched this way retain their originating
        Situation key, and every relevant log entry carries explicit Situation
        tags rather than being inferred from broad subject matches.
      rationale:
        - One command, validation, forecast, AI, and log path keeps a Situation shortcut honest about what the player can do.
        - Explicit provenance gives related history exact membership and survives later changes to the participants.
        - "[ai] Repeated projected actions carry semantic context links so every force-objective alternative stays individually identifiable without client-owned war rules."
        - "[ai] The shortcut and the ordinary path converge on provenance as well as on command, validation, and forecast: an ordinary order that a live visible lifecycle's current projection offers at the same target, leader, and formal-war context inherits that lifecycle's occurrence when it starts (situations::offering_lifecycle, consulted by apply_command's StartAssignment branch), so an answer whose effect reads its origin cannot be made to lie by pressing the province button instead of the card's, and every other answer merely gains exact history membership."
      references:
        - situation-system
        - scripted-command-boundary
        - assignments-declare-who-they-may-target
        - single-source-leader-availability
        - notable-result-message-log

  - decision: situation-errors-are-visible-and-deterministic
    core:
      status: accepted
      confidence: confirmed
      title: Runtime Situation Errors Become Unavailable Cards
      summary: >-
        Content loading and validation fail hard for malformed Situation
        definitions, missing functions, invalid bindings, audiences, actions,
        outcomes, fallbacks, or text keys. A runtime trigger or projection
        error preserves the affected lifecycle as an Unavailable card,
        suppresses its actions and warnings, and writes one deterministic log
        diagnostic per snapshotted error fingerprint instead of silently
        removing or repeatedly spamming the Situation. An outcome error retains
        the active lifecycle as unavailable rather than discarding it or
        manufacturing a fallback result at runtime.
      rationale:
        - A broken explanatory layer must be visible without being allowed to issue unsafe commands or erase an unresolved authoritative conflict.
        - Snapshotted fingerprints make log-once behaviour identical after restore and replay.
      references:
        - scripted-content-with-ci-validation
        - situation-lifecycle-leaves-dismissible-resolutions
        - deterministic-seed-and-command-replay

  - decision: situations-own-one-dock-and-attention-links
    core:
      status: accepted
      confidence: confirmed
      title: Situations Own the Default Right Dock and Attention Links
      summary: >-
        The Situations panel opens in the right dock by default, replacing
        Listing in the initial layout while Listing remains available from the
        toolbar. It orders newest resolutions first, then active warnings, then
        remaining active instances by descending authored priority and stable
        key. The old map SituationItem becomes AttentionItem so a warning may
        focus either a province or a Situation. Spectators see every Situation
        but no gameplay actions; private audiences otherwise remain authored.
      rationale:
        - "[ai] Making the new strategic surface visible on day one prevents its opening instances from becoming a feature the player must discover in a menu."
        - Keeping warnings as derived links preserves the existing non-pausing attention model.
      references:
        - situation-system
        - formal-wars-use-the-situation-surface
        - strategic-map-intelligence-modes
        - m7-spectator-mode

  - decision: formal-wars-have-occurrence-stable-ledgers
    core:
      status: accepted
      confidence: confirmed
      title: Formal Wars Have Occurrence-Stable Persistent Ledgers
      summary: >-
        Each declaration allocates a WarId and records an authoritative
        WarRecord with cause, opening date, two nonempty disjoint sides, side
        leaders, ordered organisation members, adoption history, and optional
        conclusion date and reason. A guaranteed seven-day head-led assignment
        declares the war. Concluded records remain available for history,
        replay, and the Formal War Situation resolution. A war belongs to
        organisations and survives head succession, claimant death, and claim
        renunciation. This milestone adds no alliance, coalition, casus belli,
        front, war-score, surrender, or inactivity-peace system.
      rationale:
        - "[ai] Occurrence identity distinguishes repeated wars between the same organisations and lets assignments, blockades, logs, and resolutions name exactly the conflict they belong to."
        - Persisting concluded records makes a war's history authoritative rather than reconstructing it from display text.
      references:
        - formal-war-system
        - stable-game-identity
        - versioned-snapshots-plus-command-log
        - formal-wars-use-the-situation-surface

  - decision: war-sides-freeze-branches-with-explicit-liege-adoption
    core:
      status: accepted
      confidence: confirmed
      title: War Sides Freeze Realm Branches with Explicit Liege Adoption
      summary: >-
        Declaration recursively adds each leader's current transitive vassal
        branch. For an internal war, the descendant keeps its whole branch and
        that branch is excluded from the ancestor's side, supporting sibling,
        liege-vassal, and rebellion conflicts without overlap. Membership then
        stays frozen. A nonparticipating liege may use a guaranteed seven-day
        head-led adoption assignment to join the side containing its vassal,
        add its current branch except existing opponents, become side leader,
        and assume whole-war peace authority. There are no defections or
        separate settlements in this milestone.
      rationale:
        - "[ai] Snapshotting the declared branches makes war membership deterministic and legible even when peacetime liege relationships change mid-conflict."
        - Explicit adoption creates a visible escalation decision instead of making every overlord join automatically.
      references:
        - formal-war-system
        - legal-holdings-and-obligations
        - characters-are-the-acting-unit
        - situation-actions-launch-authoritative-assignments

  - decision: exact-war-identity-gates-hostility-and-operations
    core:
      status: accepted
      confidence: confirmed
      title: Exact War Identity Gates Hostility and Military Operations
      summary: >-
        AssignmentTarget gains War and forecasts, commands, active assignments,
        snapshots, and blockades carry an optional exact WarId. Siege and
        blockade require the owner and target holder to oppose one another in
        that active war at start and resolution; peace aborts assignments bound
        to it and clears its blockades while retaining territorial outcomes.
        The existing probabilistic twenty-day negotiation assignment settles
        the whole war and is authorised only for the current side leader.
        Standing orders, defenders, map hostility, occupation pressure, trade,
        and blockades ask shared war-side predicates. Raids remain deniable and
        create hostility only for that operation.
      rationale:
        - "[ai] Binding an operation to one occurrence prevents a peace followed by a new war between the same parties from reviving old orders or blockades."
        - Shared predicates keep the map, economy, defence automation, and assignment validation from disagreeing about who is an enemy.
      references:
        - formal-war-system
        - engine-owned-military-operations
        - standing-orders-fire-for-idle-armies
        - map-facts-are-simulation-answers

  - decision: claimant-war-blocks-paramount-press
    core:
      status: accepted
      confidence: confirmed
      title: A Live Rival-Claimant War Blocks Pressing the Paramountcy
      summary: >-
        The ninety-day press assignment revalidates its personal claim,
        vacancy, whole-realm dominance, and war state at start and completion.
        It cannot award the title while its claimant opposes another currently
        valid claimant in an active formal war. An unrelated war does not
        block; if the rival dies or renounces, their continuing organisation
        war stops blocking. A blocking war begun during the attempt causes the
        attempt to fail, while peace before completion permits success.
      rationale:
        - "[ai] A claimant should not settle the succession administratively while their right is still being fought by another live claimant."
        - Revalidation prevents a dead, dependent, renounced, or no-longer-dominant claimant from receiving a delayed title award.
      references:
        - province-count-paramountcy-claim
        - formal-war-system
        - paramountcy-is-personally-claimed-by-independent-heads

  - decision: autonomous-paramount-claimants-fight-through-authored-plans
    core:
      status: accepted
      confidence: confirmed
      title: Autonomous Paramount Claimants Declare and Fight through Authored Plans
      summary: >-
        An eligible independent head adopting the take-the-planet ambition may
        run the one-day declaration assignment before attaining dominance. A
        trailing claimant challenges the leading claimant only when its
        prospective war branch has at least seventy-five percent of the
        leader's raised army manpower. Authored plans then choose the
        lowest-order stable-ID enemy province, prosecute war through ordinary
        assignments and standing orders, negotiate when dominant or unable to
        continue, and press only after peace. Claim-war plans use zero cooldown
        so they may continue this deterministic loop while the ambition holds.
      rationale:
        - "[ai] The seventy-five-percent floor permits risky political wars without sending obviously hopeless branches into deterministic ruin."
        - Reusing goals, plans, assignments, and standing orders gives autonomous characters no privileged path through the new rules.
      references:
        - paramountcy-is-personally-claimed-by-independent-heads
        - formal-war-system
        - plans-are-authored-campaigns
        - standing-orders-are-priority-lists
        - intent-driven-organisation-agency

  - decision: situations-and-formal-wars-use-snapshot-18
    core:
      status: accepted
      confidence: confirmed
      title: Situations, Personal Claims, and Formal Wars Use Snapshot 18
      summary: >-
        Snapshot format 18 captures personal Paramount claims, active and
        concluded wars and adoption history, war-bound assignments and
        blockades, cancellation state, obligation source keys, active Situation
        lifecycles, resolution notices, diagnostic fingerprints, log Situation
        tags, and assignment Situation origins. This pre-release project rejects
        version 17 snapshots rather than migrating them.
      rationale:
        - "[ai] A single format bump covers the mutually connected state shape instead of creating several short-lived intermediate versions during one milestone."
        - Refusing the old pre-release shape is safer than inventing war and Situation identities during migration.
      references:
        - versioned-snapshots-plus-command-log
        - formal-wars-have-occurrence-stable-ledgers
        - situation-lifecycle-leaves-dismissible-resolutions
        - claimant-war-blocks-paramount-press

  - decision: script-host-is-the-fleets
    core:
      status: accepted
      confidence: confirmed
      title: The Sandbox Is Extracted; The Vocabulary Stays
      summary: >-
        The Rhai sandbox profile, the framed content hash, and the
        context-in call seam move to vellum-script, extracted from this
        game as the fleet's deterministic script host. What stays here is
        the vocabulary: which builder functions the loading engine
        registers, the shape of the context a call receives, and how a
        returned value becomes typed effects or another call-site-specific
        typed model — one game's content model,
        not a general mechanism. A pure extraction, proven rather than
        asserted: the content hash and every acceptance replay hash are
        byte-identical across the change.
      rationale:
        - >-
          The sandbox's value is in what it *refuses*, and every refusal has
          a reason that is easy to lose when the next game writes its own:
          building deny-by-default from a raw engine rather than stripping a
          full one, absent wall clock, dummy module resolver, disabled eval,
          hard limits, integer-only arithmetic. Those reasons are now
          written once, with tests that fail if a capability creeps back in.
      references:
        - deterministic-campaign-simulation
        - fleet-foundation-adoption

  - decision: client-owned-versioned-interface-preferences
    core:
      status: accepted
      confidence: confirmed
      title: Interface Scale and Density Persist Outside the Campaign
      summary: >-
        The client exposes 100%, 125%, 150%, and 200% whole-interface scale
        choices independently from Compact and Comfortable density. One
        versioned codec is stored under the operating system's stable per-user
        application configuration directory or the stable
        last-aeon.ui.preferences browser local-storage entry and fails softly
        to 100% Compact when it is missing, corrupt, inaccessible, or from an
        unsupported future version. Native filesystem and shared browser-shaped
        adapter contracts are tested through injectable backends, while Trunk
        supplies wasm compile coverage. Title and campaign surfaces edit the
        same resource. The preference resource remains in aeon_client and an
        isolation test proves it never changes commands, snapshots, or hashes.
      rationale:
        - "[ai] Separating scale from density lets a player enlarge the whole interface without making information disappear, while retaining the existing compact presentation as the default."
        - "[ai] A shared codec and platform-specific storage adapters give native and web the same contract without teaching the authoritative simulation about presentation state."
        - "[ai] Resolving native storage through per-user application configuration directories makes persistence independent of launch working directory while keeping read and write failures recoverable."
      references:
        - egui-with-owned-design-tokens
        - shared-native-and-web-delivery
        - headless-authoritative-simulation

  - decision: logical-point-responsive-campaign-shell
    core:
      status: accepted
      confidence: confirmed
      title: Campaign Chrome Reflows from One Shared Logical-Point Plan
      summary: >-
        The client computes one deterministic layout plan from the egui
        viewport after interface scale is applied. Spacious mode keeps a
        one-band top bar and columnar bottom dock. Below 1400 logical points
        wide or 640 points tall, Compact mode uses two wrapping top-bar bands
        and persistent tabs for bottom panels. Side and bottom docks are
        clamped as a group, ordinary panel content scrolls vertically, and
        floating search, attention, and assignment surfaces are constrained to
        the viewport. The presentation changes no commands or simulation data.
        A deterministic embedded-campaign fixture renders the complete
        production shell, including its docks, compact tabs, search and attention
        overlays, Situation panel, assignment popup, and forecast renderer. It
        uses one coherent per-tuple flow: real subject and time controls, the
        Situation action and its hover forecast, that action's shared assignment
        popup and Confirm, then the emitted StartSituationAssignment through the
        client command and elapsed-time seams until it naturally projects its
        resolution and tagged history. Passive production instrumentation checks
        full raw 24-point responses contained by their active clips and viewport
        for headers, compact tabs, search, attention, time, subject, action, and
        Confirm, plus vertical-only scroll geometry, materially visible clipped
        forecast/resolution/history galleys, and resolved panel/window contrast.
        Native tests and wasm-bindgen-test in headless Chrome execute every
        display-matrix tuple from the same harness.
      rationale:
        - "[ai] Planning in logical points makes interface scale part of the input and prevents native and web from drifting into target-specific responsive policies."
        - "[ai] Tabs preserve every bottom panel and command at short heights without forcing ordinary text into simultaneous horizontal and vertical scrolling."
        - "[ai] The shared production-path fixture plus headless Chrome execution gives repeatable native/web rendered-state evidence without pretending it is a pixel-perfect screenshot baseline."
      references:
        - egui-with-owned-design-tokens
        - client-owned-versioned-interface-preferences
        - shared-native-and-web-delivery
        - headless-authoritative-simulation

  - decision: rendered-order-keyboard-navigation
    core:
      status: accepted
      confidence: confirmed
      title: Keyboard Focus Follows the Rendered Responsive Surface
      summary: >-
        The client keeps keyboard policy entirely in presentation. Egui's
        registry is rebuilt from focusable response rectangles, paint layers,
        and explicit visual surface bands after responsive reflow. Tab and
        Shift+Tab traverse that sorted registry; arrow keys rove within visual groups.
        Enter and Space activate the ordinary widget response. Escape unwinds
        the nearest picker, assignment composition, settings, or search and
        restores its invoker. Situation subjects, actions, leader choices,
        custom icon controls, Confirm, and time controls expose a visible
        audited focus boundary. Focused forecast-bearing controls disclose the
        same authoritative forecast as hover. Neither focus nor navigation
        emits a PlayerCommand or advances the campaign clock.
      rationale:
        - "[ai] Deriving traversal from widgets that were actually rendered prevents compact reflow from creating a second, stale spatial model."
        - "[ai] Restoring the logical invoker makes Escape reversible even when a floating surface temporarily owns focus."
        - "[ai] Stable logical keys let reflow resolve a changed egui ID and choose an adjacent visible fallback when the original control disappears."
        - "[ai] Reusing normal activation, forecast, command, and clock paths keeps keyboard support presentation-only and headless-authoritative."
        - "[ai] Raw action capture occurs before a separate explicit registry step: rendered tests independently sort every captured enabled response and require an exact logical-ID match with the traversal registry, while a deliberately unregistered negative fixture proves omissions fail the audit."
        - "[ai] Situation repair is occurrence-scoped: an action carries occurrence and action identity, and only a newly created resolution for that same occurrence may receive focus after the action disappears."
        - "[ai] Escape uses one shared per-press claim before strategic view hotkeys, in picker, assignment, settings, then search order; the egui pass consumes a claimed event so one press closes exactly one local layer, while an unclaimed press retains the normal Body-to-System fallback."
        - "[ai] Settings stores the logical key of the real action that opened it and resolves that invoker, or the documented adjacent visible fallback, against the current rendered registry on Escape or visible close."
        - "[ai] Floating campaign surfaces omit egui's unregistered title-bar close response and provide localized captured Close or Cancel actions instead, making visible closure part of the exact Tab registry and the same logical-invoker restoration path as Escape."
      references:
        - logical-point-responsive-campaign-shell
        - egui-with-owned-design-tokens
        - shared-native-and-web-delivery

  - decision: core-explanations-are-owned-focusable-snapshots
    core:
      status: accepted
      confidence: confirmed
      title: Core Explanations Are Owned, Focusable Snapshots
      summary: >-
        The client gives consequential Situation actions and candidate
        comparisons an always-visible compact forecast summary plus a shared
        detail trigger. Pointer hover and keyboard focus render the same
        transient body from the same authoritative AssignmentForecast. Explicit
        pointer hover remains owned by the originating response so its popup
        cannot cover or displace that control; keyboard focus alone uses an
        explicit response-anchored tooltip with the identical body. Explicit
        activation of the separate Pin details control copies the title,
        summary, and forecast into one client-owned snapshot; it never activates
        the underlying action or emits a PlayerCommand. Every production source
        supplies a stable semantic logical key (Situation occurrence and action,
        candidate character, or assignment and surface), so identical display
        titles remain distinct controls and dismissal restores the exact
        invoker. The pinned window is
        constrained to the current viewport, wraps and scrolls vertically,
        survives selection changes, responsive reflow, and resolution of its
        source Situation, and is dismissed by its visible control or Escape.
        A client-owned per-press claim is established before ordinary Update
        navigation and consumed at the head of the later egui pass, preventing
        the same
        physical Escape from also changing map, popup, search, form, or command
        context; with no pinned snapshot, Escape falls through normally.
        Full forecast bodies write the meaning of duration and delay,
        guaranteed costs, contests and distributions, conditional risks,
        military-operation exclusions, recall limits, and authored outcomes
        directly into the layout rather than leaving those consequences in
        pointer-only tooltips.
        Native and headless-Chrome rendered-state tests exercise the same
        production widgets and verify focus without a pointer, pinning,
        persistence, geometry, dismissal, and command isolation.
      rationale:
        - "[ai] A copied presentation snapshot lets the player finish reading an explanation after its live source changes without retaining or mutating authoritative campaign state."
        - "[ai] Keeping action activation and explanation pinning on distinct focusable controls removes ambiguity for pointer, keyboard, and touch interaction."
        - "[ai] One renderer for hover, focus, and pinned help prevents explanatory meaning from drifting between access routes."
        - "[ai] Sharing one Escape claim across Bevy input and egui ordering gives pinned help semantic priority without teaching authoritative simulation state about UI events."
        - "[ai] A pinned or keyboard-focused forecast must be semantically complete on its own; retaining pointer-only definitions inside that body would merely move the accessibility boundary into the new help surface."
        - "[ai] Response-owned hover placement preserves the action's stable hover geometry, while limiting explicit tooltip construction to pointerless keyboard focus keeps both routes equivalent without making them mechanically identical."
        - "[ai] Display copy is localised and non-unique, so Pin traversal and focus restoration use caller-owned domain identity rather than titles; rendered duplicate-title coverage protects that boundary."
      references:
        - job-forecast-and-explanation-ui
        - forecasts-derive-from-shared-resolution-code
        - logical-point-responsive-campaign-shell
        - headless-authoritative-simulation

  - decision: situation-context-carries-activation-and-start-facts
    core:
      status: accepted
      confidence: confirmed
      title: Situation Contexts Carry Activation and Campaign-Start Dates
      summary: >-
        Every Situation script call context gains an `activated` field and
        the shared semantic world view gains `start_date`. Projection and
        outcome calls receive the exact instance's activation date; a
        trigger receives the oldest live activation for its definition and
        source — exact for single-instance Situations — or the unit value
        when nothing is active. Both values are copies of authoritative
        clock and lifecycle facts, so authored content can compute
        deadlines such as "seven days after activation" and one-shot
        opening-day gates without any Rust-side special case.
      rationale:
        - "[ai] Deadlines are gameplay values, so their arithmetic belongs in authored content; without the activation date in context, every dated demand would need a bespoke Rust rule."
        - "[ai] Giving triggers the oldest live activation rather than a per-instance date keeps the synthetic trigger context honest: bindings are the trigger's own output and cannot key a lookup before they exist."
        - "[ai] The start date makes 'the campaign's first day' expressible, which is what lets a scenario author a demand that activates exactly once and never reactivates after resolving."
      references:
        - situations-project-live-facts-into-authored-context
        - situation-instances-have-structural-identity
        - deterministic-campaign-simulation

  - decision: situation-outcomes-emit-owned-effects
    core:
      status: accepted
      confidence: confirmed
      title: Situation Outcomes May Emit Effects for a Bound Organisation
      summary: >-
        A Situation outcome may declare an `effects_fn` returning the same
        typed effect vocabulary assignment results use. Because a Situation
        has no leader or target, the definition names an `owner_binding` —
        a declared organisation binding — and validation refuses effects
        without one, an undeclared name, or a non-organisation kind. When
        the outcome resolves, the effects are parsed, resolved against
        roles seeded from that owner, applied once after the new lifecycle
        state is installed, and tagged with the exact Situation occurrence
        and audience. The vocabulary gains a `resources` effect applying
        exact signed wealth, manpower, supplies, and influence changes to
        the owner, verbatim: content owns the magnitudes, and a pool may go
        negative when an authored consequence says so.
      rationale:
        - "[ai] Situations previously only described; a deadline whose lapse costs the stated Influence needs a consequence path, and reusing the assignment effect boundary keeps scripts pure and the vocabulary single."
        - "[ai] An explicit validated owner binding stops a consequence from silently addressing nobody, which a role-vocabulary default would have allowed."
        - "[ai] Applying effects after state installation in resolution order keeps the day's evaluation deterministic and lets the resolution's own log line precede any effect logs."
        - "[ai] Exact-amount application is the contract the player was promised in advance; clamping would make the stated forfeit a lie at low pools."
      references:
        - situation-lifecycle-leaves-dismissible-resolutions
        - scripts-emit-validated-effects-only
        - situations-project-live-facts-into-authored-context
        - deterministic-campaign-simulation

  - decision: situation-activations-may-announce-through-popups
    core:
      status: accepted
      confidence: confirmed
      title: Situation Activations May Announce Through Ordinary Popups
      summary: >-
        A Situation definition may carry a table-decided activation
        announcement: when the row `situation.<id>.announcement` exists,
        each activation the current player may see pushes one ordinary
        pending popup carrying the announcement text, the definition key,
        a single acknowledgement choice, roles seeded from the owner
        binding, and the exact occurrence. The popup is authoritative
        popup state, so the client's existing popup auto-pause covers the
        activation and acknowledgement is an ordinary logged AnswerPopup
        command with no effects. Situation warnings keep the deliberately
        non-pausing attention model; only authored announcements pause.
      rationale:
        - "[ai] The day-one demand must interrupt, and the popup channel already owns deterministic pause-worthy interruptions with snapshot, replay, and answer semantics — a parallel pause path would drift."
        - "[ai] Table-decided prose follows the house rule that the row decides optional text, so an announcement cannot exist without its words or point at the wrong ones."
        - "[ai] Gating on authored visibility keeps a private house's demand from interrupting a rival player while remaining a pure function of authoritative state."
      references:
        - result-level-popups
        - situations-own-one-dock-and-attention-links
        - situation-instances-have-structural-identity
        - scripted-command-boundary

  - decision: the-court-awaits-is-an-ordinary-one-shot-demand
    core:
      status: accepted
      confidence: confirmed
      title: The Court Awaits Is an Ordinary One-Shot Scenario Demand
      summary: >-
        The Ashkarr scenario attaches The Court Awaits, a scenario-sourced
        Situation bound to House Harrow that activates exactly once, on the
        campaign's first day, and never reactivates. Its trigger counts an
        ordinary accepted assignment — owner is the bound house, started on
        or after activation and no later than activation plus the authored
        seven days — so acceptance, not completion, answers the court, and
        the deadline day itself still counts. Missing the window selects a
        lapsed outcome whose effects remove exactly the authored 10
        Influence, leaving a durable resolution and a playable campaign.
        Both numbers live in the scenario content; houses start with
        influence equal to authored legitimacy, so the forfeit is
        meaningful without new authored resources.
      rationale:
        - "[ai] Counting accepted work keeps the promise 'any valid command within seven days' honest even though every authored assignment outlasts the window."
        - "[ai] Satisfaction is checked before expiry so an order accepted on the deadline day answers the court, giving the boundary one deterministic reading."
        - "[ai] The start-date gate makes the demand one-shot without new snapshot state: after any resolution the trigger stays silent because the opening day never returns."
        - "[ai] The simulation rules exist identically with guidance on or off, which is what makes the equal-hash guarantee structural rather than tested-in."
      references:
        - situation-context-carries-activation-and-start-facts
        - situation-outcomes-emit-owned-effects
        - situation-activations-may-announce-through-popups
        - scripted-content-with-ci-validation

  - decision: first-reign-guidance-is-client-preference-prose
    core:
      status: accepted
      confidence: confirmed
      title: First Reign Guidance Is a Client Preference over Authored Prose
      summary: >-
        Scenario guidance is a default-on boolean in the client-owned
        versioned interface preferences, edited beside scale and density on
        the title and campaign settings surfaces. The stored document stays
        at version one: the added field defaults on when absent, so
        pre-guidance documents keep their meaning. Guidance prose is
        table-decided content on the Situation definition —
        `situation.<id>.guidance.objective`, `.how`, and `.why` — which the
        simulation never reads. When the preference is on, a guided card
        shows the objective plus "Show me how" and "Why this matters"
        triggers reusing the shared pinnable-explanation surface, whose
        topic now carries an optional forecast so prose-only help renders
        without inventing numbers. Guidance emits no commands, and the
        preference isolation proof covers it.
      rationale:
        - "[ai] Making guidance a preference rather than campaign state is what lets one campaign produce identical authoritative hashes with it on or off, and lets an expert disable it in one action before starting."
        - "[ai] Authoring guidance as definition prose keeps native and web byte-identical, keeps the orphan-row and missing-row audits covering it, and gives later guided Situations the same three rows to fill."
        - "[ai] Reusing the pinned-explanation surface keeps keyboard reach, focus restoration, and dismissal semantics identical to every other explanation instead of adding a tutorial-only widget."
      references:
        - client-owned-versioned-interface-preferences
        - core-explanations-are-owned-focusable-snapshots
        - the-court-awaits-is-an-ordinary-one-shot-demand
        - headless-authoritative-simulation

  - decision: situation-responses-are-recorded-occurrence-answers
    core:
      status: accepted
      confidence: confirmed
      title: Situation Responses Are Durable Occurrence-Keyed Answers
      summary: >-
        A Situation definition may declare pure responses — political
        answers with no assignment behind them, such as promising or
        refusing a demand. The player records one through a new
        AnswerSituation player command, validated and delayed like every
        other command; the accepted answer is stored on SituationState
        keyed by the exact occurrence (structural key plus activation
        date), snapshotted with the rest of Situation state, logged as
        tagged permanent history, and exposed to scripts as ctx.answer
        beside ctx.activated. The first recorded answer per occurrence is
        final; a reactivation or a requester replacement is a new
        occurrence and starts unanswered. Answers for ended lifecycles are
        pruned once their resolution has read them, so the map stays
        bounded. This amends the initial-deck rule that every gameplay
        action opens an assignment flow: recorded answers are the second
        Situation interaction kind, and they still mutate nothing directly
        — outcome predicates read them as authoritative state.
      rationale:
        - "[ai] Recording the answer on the occurrence rather than in a popup or a one-day assignment is what makes promise, refusal, and silence distinguishable months later at the deadline — popups delete on answer and completed assignments leave the live world view."
        - "[ai] First-answer-final with re-validation at delayed application keeps two same-day answers deterministic: the earlier envelope wins and the later one drops exactly as other stale commands do."
        - "[ai] Threading ctx.answer through trigger, projection, and outcome calls keeps the whole lifecycle a pure function of authoritative state, so save, replay, and equal-hash guarantees need no new machinery."
        - "[ai] The answers map changes CampaignState's serialised shape, so it rode a SNAPSHOT_FORMAT_VERSION bump to 20 — pre-release, no migration."
      references:
        - situation-actions-launch-authoritative-assignments
        - situation-instances-have-structural-identity
        - versioned-snapshots-plus-command-log
        - scripted-command-boundary

  - decision: situation-effects-may-address-a-bound-subject
    core:
      status: accepted
      confidence: confirmed
      title: Situation Outcome Effects May Address a Bound Character Subject
      summary: >-
        A Situation definition may declare a subject_binding naming one of
        its declared character bindings. When an outcome's effects or an
        activation announcement resolve their roles, the bound character
        seeds the existing `target` effect role beside the owner binding's
        organisation, through the one shared role resolver. Content can
        therefore write directional personal consequences — the requester's
        opinion of the owner's head — without widening the seven-role
        effect vocabulary or teaching Rust who a requester is. Validation
        requires the binding to be declared and character-typed.
      rationale:
        - "[ai] Reusing the target role through RoleSeed keeps the effect vocabulary closed and the resolver single-sourced, instead of inventing a Situation-only role name."
        - "[ai] Without a character seam, situation outcome effects could only address organisation-derived roles, and a household demand's personal consequence would silently address nobody."
      references:
        - situation-outcomes-emit-owned-effects
        - situation-activations-may-announce-through-popups
        - scripted-command-boundary

  - decision: household-demands-are-live-state-predicates-on-a-shared-anchor
    core:
      status: accepted
      confidence: confirmed
      title: Household Demands Are Live-State Predicates on One Shared Anchor
      summary: >-
        Kessarin's Order is the household-demand exemplar, and Aleyn's
        Levies and Torvald's Standing are the second and third instances
        of the same shape: where Kessarin's goal is universal over
        holdings (every held province at or above the authored 850
        Order), Aleyn's is an aggregate over owned armies (total fielded
        manpower at or above the authored 1,000), and Torvald's is a
        derived relationship (the bound liege head's net opinion of the
        house's current head at or above the authored zero) that the
        player influences only indirectly and third parties move in both
        directions — each a pure live-state predicate recomputed from
        current authoritative state — holders and Order, army ownership
        and manpower, or derived opinion facts — never from assignment
        starts or interface interaction. All three demands share one
        deadline derived from pure campaign facts:
        world.start_date plus the authored court window plus the authored
        120-day household window, so the anchor never depends on when the
        court was actually answered or on per-definition activation
        quirks. A demand activates once the court's test is behind the
        reign, resolves the first settled day its goal holds (achievement
        wins over any recorded answer, refusal included), and otherwise
        resolves on the deadline day by tiers: refusal -5/1,080, broken
        promise -20/1,800, silence -10/1,440, achievement +10/1,440 —
        each tier a distinct stable opinion reason from the bound
        requester toward the owner's head, with every magnitude authored
        in scenario content. A requester who dies or is replaced before
        the deadline ends the lifecycle with a no-effect passed-on
        outcome, and the authored pure replacement rule (the named family
        member, else the first living adult non-head member in stable ID
        order) binds the successor's new lifecycle. If an achieved goal
        later slips below target inside the shared window, the household
        may raise the demand again as a new unanswered lifecycle; opinion
        modifiers replace by (target, reason), so tiers never stack.
      rationale:
        - "[ai] Anchoring the shared deadline to start_date kept issues 13 and 14 attachable without coordination state: each demand computed the same date from the same pure facts, both later demands landed on the anchor unchanged, and an unmet shared boundary now resolves all three lifecycles in the one evaluate pass, in stable definition-key order with strictly increasing resolution ids and each tier on its own requester's ledger."
        - "[ai] Torvald's demand binds the exact liege head as a third character binding beside house and requester, because its goal is one man's regard: a changed liege, a dead liege head, or a deposed one changes the structural key, so the old lifecycle ends passed-on with no tier. The achieved outcome additionally requires the bound man to still stand as the liege's living head — the ended lifecycle resolves its outcome predicates against the live world with the old bindings, and without that clause a Veyrin succession would pay the achievement tier from the successor's warmer derived affinity in the very pass that should pass the demand on."
        - "[ai] Torvald's goal reads the bound liege head's opinion of the live house head: the demand follows the office of head-of-house, matching the owner-head effect role its tiers pay toward, so a replaced Harrow head continues the same lifecycle (same house, requester, and liege head bindings) and the tier lands on whoever heads the house when the demand resolves."
        - "[ai] The authored cost of the third demand is the ordinary court assignment, org-targeted at the liege: led by the head it lands the courted and courted-house modifiers on the same pair (+20 on plain success, enough from the authored -15 opening affinity), pricing the goal at 45 of the head's days and 15 wealth against the sibling demands that also want the head — and idle AI agency never starts costed org-targeted assignments for the player's house, so the number moves only through deliberate play or third-party relationship effects."
        - "[ai] Resolving at first achievement makes completion historical — the notice, the opinion tier, and the log survive while provincial Order keeps moving normally — rather than freezing a checkbox until the deadline."
        - "[ai] Achievement overriding refusal follows the accepted rule that achieving a goal satisfies it whether or not the player promised; a promise (or refusal) changes only the consequence of failure."
        - "[ai] The passed-on outcome keeps death from converting into a silence penalty from a dead requester, while the deterministic successor rule keeps trigger and projection in exact agreement."
        - "[ai] Aleyn's demand proves the predicate seam needs no per-route wiring: no assignment or click is required, so a muster, a retried muster after an ordinary unrefunded failure, or any future manpower source satisfies it identically, and a disbanded or destroyed army un-satisfies it while the demand is open — all through the one live predicate, with no tutorial protection anywhere."
      references:
        - situation-responses-are-recorded-occurrence-answers
        - situation-effects-may-address-a-bound-subject
        - the-court-awaits-is-an-ordinary-one-shot-demand
        - situation-context-carries-activation-and-start-facts

  - decision: assignment-effectiveness-may-read-an-authored-opinion
    core:
      status: accepted
      confidence: confirmed
      title: Assignment Effectiveness May Read an Authored Live Opinion
      summary: >-
        An assignment definition may author an opinion_modifier block —
        from, toward, per_point, min, max — whose roles reuse the closed
        effect vocabulary restricted at load to the ones resolvable from
        the owner and leader alone (leader, owner-head, liege-head,
        consul), resolved through the one shared role resolver. The
        mechanism is Rust and every number is authored data: the live
        opinion between the two resolved characters, times per_point
        hundredths of an effectiveness point, truncated toward zero and
        clamped to the authored bounds (min at most zero, max at least
        zero, so neutral regard is always neutral), is added inside the
        shared effectiveness calculation — which now takes the owning
        organisation — never beside it. The forecast reports the opinion
        it read and the shift it produced as first-class fields, and the
        client renders them under the skill contest line. Resolution reads
        the live relationship on its own day, exactly as it reads the
        leader's live skill.
      rationale:
        - "[ai] Placing the shift inside forecast::effectiveness is what keeps the forecast-equals-resolution invariant structural: both call the one function, so an authored relationship cannot be priced into the odds shown and forgotten by the roll, or vice versa."
        - "[ai] Restricting the roles to owner-and-leader-resolvable ones at load makes an unresolvable modifier a loud content error instead of a silent read of nobody's opinion; a house that merely lacks a liege at runtime reads as neutral, never as a penalty invented on the spot."
        - "[ai] Reporting opinion_value and opinion_shift on the forecast keeps the number authoritative AND visible — the interface explains the odds it quotes rather than quoting shifted odds with no stated cause."
        - "[ai] per_point in hundredths keeps the arithmetic pure integers on the same effectiveness scale as skills, while the authored clamp guarantees a relationship can shade a contest but never zero out skill entirely."
      references:
        - forecasts-derive-from-shared-resolution-code
        - skill-shifted-result-weights
        - situation-effects-may-address-a-bound-subject
        - scripted-content-with-ci-validation

  - decision: casimirs-visit-is-a-windowed-hosted-situation
    core:
      status: accepted
      confidence: confirmed
      title: Casimir's Visit Is a Windowed, Hosted, Live-State Situation
      summary: >-
        The First Reign arc's first-year test is a scenario Situation,
        casimir-visit, active on any settled day in the authored window
        (start plus 140 to start plus 180) on which the house stands and
        holds ground, the liege's living head exists, and a breadth-first
        search over the authored route graph — surface and space legs
        alike, from the head's concrete province — reaches a held
        province. The trigger binds the LIVE liege head beside the house,
        so death, deposition, or a changed liege ends the bound lifecycle
        with a no-effect passed-on outcome and, while the window and
        travel allow, the successor's own visit binds him; impossible
        travel likewise defers, cancels, or re-raises the visit through
        the same predicates, with no protected plot logic anywhere.
        Hosting is three ordinary ai_available:false assignments —
        restrained, proper, lavish — authored with rising wealth cost,
        falling difficulty, rising duration, per-tier opinion modifiers
        reading the liege head's current opinion of the owner's head, and
        graded opinion results; acceptance inside the window (the closing
        day inclusive, the court's deadline rule) resolves the Situation
        hosted, and every tier's duration is at least the window's length,
        which is what makes the visit one-shot without new snapshot state.
        A window that closes unanswered while the bound head still stands
        and can come resolves slighted, whose effects_fn applies the
        authored penalty once through the subject binding. The projected
        tier actions deliberately pin no leader: a projected action
        without a leader means the player chooses the host, and the client
        previews the deterministic default (the player's head), opens the
        ordinary composition popup with that default prefilled, and lets
        the free picker compare every eligible host by the same
        authoritative per-candidate forecasts.
      rationale:
        - "[ai] Acceptance-resolves-hosted with tier durations of at least the window length closes the one-shot gap statelessly: an accepted reception is still running whenever the trigger could re-ask, so the visit can never be hosted twice, while a cancelled reception legitimately re-opens the expectation inside the window."
        - "[ai] Every consequential outcome predicate re-asserts that the bound liege head still stands and can still come, because an ended lifecycle judges its outcomes with old bindings against the live world — without that clause the evaluation that should pass a dead liege's visit on could pay hospitality's dues to him instead."
        - "[ai] Reachability is asked of the same authored route facts real travel uses, computed in content by BFS rather than hardcoded connectivity, so a liege aboard a ship, a landless house, or a severed graph all mean no visit — and mean it identically in the trigger and the outcome predicates."
        - "[ai] Binding the live liege head rather than the named character is what makes the arc authored expectation instead of protected destiny: the content follows the simulation through succession and deposition, and the named-man framing lives only in prose."
        - "[ai] Leaderless projected actions are the smallest client rule that makes host choice real: enabled when the simulation has no objection, previewed with the deterministic default head, and composed through the existing free picker — no new widget, no client-owned eligibility rule."
      references:
        - assignment-effectiveness-may-read-an-authored-opinion
        - household-demands-are-live-state-predicates-on-a-shared-anchor
        - the-court-awaits-is-an-ordinary-one-shot-demand
        - situation-activations-may-announce-through-popups
        - authored-routes-and-physical-personal-transport

  - decision: covert-provenance-is-an-audience-on-authored-plans-and-assignments
    core:
      status: accepted
      confidence: confirmed
      title: Covert Provenance Is an Audience on Authored Plans and Assignments
      summary: >-
        The information contract for authored covert work: a plan, goal,
        or assignment definition may author covert: true, and before
        exposure every ordinary player surface then narrows that work's
        provenance to its owning organisation — plan adoption, completion,
        and abandonment lines, goal adoption and end lines, and every
        assignment-derived line (results, dead-leader abandonment,
        interruption, script faults, war teardown) carry an owner-only
        LogAudience through the existing assignment_log_entry choke point;
        the guaranteed hostile-plan rumour is not whispered at all; and
        the character inspector omits its pursuing line for every ordinary
        player. Nothing is deleted or rewritten: the lines are written
        with their narrowed audience, LogAudience::visible_to(None)
        remains omniscient, so spectators and replay verification retain
        complete authoritative provenance, and the Situations panel's
        per-card history now also filters by each entry's own recorded
        audience as defence in depth. Exposure is one deliberate seam —
        covert::is_exposed, a stub returning false until the
        investigation issue gives it authoritative state — through which
        every simulation-side covertness read passes: the plan lines in
        plans.rs, the goal lines in goals.rs, every assignment-derived
        line in assignments.rs, and the covert flag on the semantic world
        view in script_world.rs, so exposure flips all of those at once.
        The client's inspector pursuing-line gate is the one deliberate
        exception: its PanelCtx holds no World, so the gate reads the
        authored covert flag directly. It behaves identically before
        exposure, and the investigation issue must project exposure state
        client-side and rewire that gate to read it.
        [ai] SUPERSEDED IN PART by
        investigation-proves-the-bound-culprit-through-durable-exposure-state,
        which filled the seam. Three details of the paragraph above now
        read differently, and only these three: is_exposed became a
        per-viewer question backed by snapshotted covert::Exposure state
        (so the no-separate-snapshot-state rationale below holds for
        covertness itself but not for discovery, and
        SNAPSHOT_FORMAT_VERSION moved to 21); the write-time surfaces ask
        covert::audience — the owner plus every house that has already
        proved it — rather than an owner-only audience, still stamped once
        and never re-widened; and the inspector exception is closed, that
        gate now calling covert::plan_named_to_viewer over the projected
        Exposure resource. Everything else here stands unchanged.
        This decision qualifies, without repealing, the
        accepted open-information rules that the inspector openly names
        AI plans and that a plan aimed at the player produces a
        guaranteed rumour: those rules now read "except authored covert
        work before exposure".
      rationale:
        - "[ai] Reusing LogAudience instead of a second visibility system keeps one filter behind the log panel, the Situations history, and the covert lines alike; the favour-debt privacy tests already prove the filter, so covertness inherits proven behaviour instead of new machinery."
        - "[ai] Deriving covertness from content (covert: true on the definition) adds no snapshot state, so SNAPSHOT_FORMAT_VERSION stays at 20 and every recorded campaign restores unchanged; the persisted audience on each line is what already existed. [ai] Qualified by the investigation decision: covertness is still pure content, but what investigation DISCOVERS is durable state of its own, which took the snapshot format to 21."
        - "[ai] Funnelling every assignment-derived line through assignment_log_entry means the abandonment of a covert operation whose leader died cannot leak its title publicly — the one previously-public writer that would otherwise have named the work."
        - "[ai] Suppressing the rumour outright, rather than blurring it, keeps the accepted rumour rule honest: a rumour is a guaranteed coarse notice about open hostile planning, and deniability is the covert category's whole point; discovery belongs to investigation, not to a free whisper."
        - "[ai] The inspector's pursuing-line gate is recorded as a known exception rather than papered over: the client's panel context carries no World, so routing it through covert::is_exposed today would mean inventing a client-side projection of exposure state before there is any exposure state to project — work that belongs to the investigation issue, which must do it or the gate silently stays behind when the seam starts answering true."
      references:
        - household-demands-are-live-state-predicates-on-a-shared-anchor
        - the-vantar-operation-is-goal-and-plan-driven-not-scripted

  - decision: assignment-effectiveness-may-read-live-provincial-order
    core:
      status: accepted
      confidence: confirmed
      title: Assignment Effectiveness May Read Live Provincial Order
      summary: >-
        An assignment definition may author an order_modifier block —
        reference, per_hundred, min, max — read against the target
        province's live Order inside the one shared effectiveness
        calculation, exactly as the opinion modifier reads a live
        relationship: the shortfall of Order below the authored
        reference, times per_hundred hundredths of an effectiveness
        point, truncated toward zero and clamped to the authored bounds.
        Only province-bearing target kinds may author one, enforced
        loudly at load, and a target that names no province reads as
        neutral. Content authoring max: 0 makes Order pure resistance —
        the accepted rule that provincial Order modifies hostile-intrigue
        outcome weights as resistance, not as a separate hidden detection
        statistic. The forecast reports order_value and order_shift as
        first-class fields the client renders under the skill contest;
        the semantic world view exposes the same live order_shift on each
        running assignment, so a Situation projection quotes the exact
        number the resolution roll will use; and effectiveness now takes
        the assignment target, with both forecast and resolution calling
        the one function.
      rationale:
        - "[ai] Mirroring the opinion modifier's shape (authored numbers, engine arithmetic, clamp semantics, loud load validation, forecast-visible readings) makes the second modifier cost no new concepts: authoring, validation, display, and testing all follow an accepted precedent."
        - "[ai] Threading the target through effectiveness rather than reading the province beside it preserves the forecast-equals-resolution invariant structurally: the card's resistance row, the forecast line, and the roll cannot disagree because they are one calculation."
        - "[ai] reference at the settled opening Order (800) with max: 0 means the modifier only ever punishes hostile work against well-kept ground — Kessarin's 850 standard becomes a real shield — while a neglected province merely offers no extra purchase, keeping the modifier out of the player's own administrative odds."
      references:
        - assignment-effectiveness-may-read-an-authored-opinion
        - forecasts-derive-from-shared-resolution-code
        - skill-shifted-result-weights

  - decision: the-vantar-operation-is-goal-and-plan-driven-not-scripted
    core:
      status: accepted
      confidence: confirmed
      title: The Vantar Operation Is Goal- and Plan-Driven, Not Scripted
      summary: >-
        The first-year covert intrigue arc is simulation-native content,
        not an event script. A generic covert ambition
        (undermine-a-neighbour) is adoptable by any vassal head whose
        house passes an authored data window (min_campaign_day 180 to
        max_campaign_day 260, new GoalRequires fields) and capability
        floor, and resolves its target through a new authored goal
        selector, hostile-border-neighbour: an organisation outside the
        chain of command holding a surface-adjacent province, hostile by
        authored data (head-to-head opinion at or below -10, or an open
        grievance owed), lowest stable ID first — which on the authored
        map resolves Vantar's ambition to Harrow. A matching covert plan
        (deniable-pressure) gates each method on the same authored
        hostility floor via new PlanRequires predicates
        (max_target_head_opinion, target_owes_grievance) plus a
        min_wealth capability, and aims foment-unrest through a new
        target-border-province step selector (the target's most
        disordered surface-adjacent province, lowest stable ID on a tie
        — Vhorruk). The head-only scorer exposes the pressure through a
        new subvert AiIntent exactly as the claim block does, naming no
        content key. The Unquiet Holdings Situation triggers off any
        live covert province-aimed assignment against another holder's
        ground, binds house, province, and — structurally, outside the
        audience, never emitted by the projection — the culprit actor,
        shows deadline, live Order, and the exact live resistance shift,
        and resolves passed-on (holder changed), struck, or weathered by
        a pure live-Order reading against an authored line rather than
        by peeking at the hidden roll. Mid-flight target transfer is
        handled by lifecycle recomputation alone: the running assignment
        follows the same rules as any player assignment, with no new
        revalidation, because the card's passing-on already narrates the
        change and sabotage striking ground that changed hands is
        legitimate simulation. Because the plan's method gate is
        rechecked before each step, a relationship lifted above the
        authored floor abandons an uncommitted covert campaign while
        accepted work runs to its ordinary end — the reconciliation
        issue's lever, already in data.
        [ai] EXTENDED BY
        reconciliation-abandons-uncommitted-hostility-through-authored-predicates:
        the method recheck remains the above-the-floor suppressor
        described here; the +20 reconciliation line, the goal-level
        set-aside, the succession reading, and the open Cold Border
        card are recorded there. [ai] EXTENDED BY
        the-vantar-invasion-is-a-limited-formal-war-through-authored-plans:
        the same selector, floor, line, and reconciliation predicates
        arm the open first-year invasion (window 260-360) beside this
        covert one, and the invasion window the first rationale bullet
        anticipated is authored there.
      rationale:
        - "[ai] Every number the arc turns on — window days, hostility floor, capability, resistance scale, retry budget, cooldowns — is authored in Rhai; the engine grew only reusable mechanisms (two requires predicates, a goal selector, a step selector, one intent), each available to future content such as the invasion window."
        - "[ai] The goal is gated is_vassal with a modest wealth floor and adopted by the head alone: deniable pressure is the weapon of houses too small for open war, it bounds the behavioural blast radius on existing campaigns to the authored window, and it makes Perrin — not the more skilled household — the tested actor, matching the head-only claim precedent."
        - "[ai] Binding the culprit into the Situation's structural key gives investigation, spectators, and replay authoritative provenance for free — the structural key, snapshot, and resolution history all carry it — while the audience and projection never do; the exposure issue needs only a read, not new state. [ai] Corrected by investigation-proves-the-bound-culprit-through-durable-exposure-state: the binding did give investigation its culprit for free, and that is what makes false attribution structurally impossible — but WHO has discovered it could not be derived from the binding and needed durable state of its own, because a discovery has to outlive the lifecycle that produced it."
        - "[ai] Struck-versus-weathered is deliberately a live-Order reading (below or above an authored 700 line) instead of roll detection: the projection/outcome boundary can only read authoritative facts, and high Order absorbing the blow is exactly what Order-as-resistance means at the outcome level — a fortified province weathers even a landed strike."
        - "[ai] The full-AI mount is probabilistic per seed (monthly goal and agency pulses inside a three-pulse window), so acceptance pins a seed that mounts unaided and separate tests drive each boundary deterministically — the same testing posture the claim campaign acceptance takes."
      references:
        - covert-provenance-is-an-audience-on-authored-plans-and-assignments
        - assignment-effectiveness-may-read-live-provincial-order
        - casimirs-visit-is-a-windowed-hosted-situation
  - decision: investigation-proves-the-bound-culprit-through-durable-exposure-state
    core:
      status: accepted
      confidence: confirmed
      title: Investigation Proves the Bound Culprit Through Durable Exposure State
      summary: >-
        Discovery of authored covert work is an ordinary assignment with a
        typed effect and one new snapshotted resource. An investigation
        (trace-the-hand) is authored like any other consequential work —
        intrigue, authored cost, difficulty and duration, ai_available
        false — aimed at the holder's OWN troubled province rather than at
        a suspect, and offered by the Unquiet Holdings projection as an
        action pinning no leader, so the player compares every eligible
        investigator on the same authoritative per-candidate forecast the
        order itself will use. Only its success results carry an effect:
        the new ScriptEffect::Expose { binding }, resolved in
        apply_effects_with_origin, the one layer holding both the effect
        list and the originating SituationOccurrence. The culprit is read
        from that lifecycle's named structural binding — never chosen,
        never scored — so failure, disaster, and an Expose fired with no
        Situation origin all name nobody and the last refuses loudly.
        False suspects are therefore structurally impossible rather than
        merely unauthored.
        What discovery records is covert::Exposure, a new snapshotted
        resource of {culprit, knower, occurrence, discovered} records in a
        BTreeSet, at most one per culprit-and-knower pair, bumping
        SNAPSHOT_FORMAT_VERSION to 21. It is its own snapshot section
        because it must OUTLIVE the lifecycle that found it, which rules
        out SituationState, whose per-occurrence bookkeeping is pruned when
        a lifecycle ends.
        covert::is_exposed is settled as a per-viewer question — "may this
        viewer name this culprit" — answering true for a spectator, for the
        culprit itself, and for a house holding a record. The write-time
        surfaces (plan, goal, and assignment lines) have no viewer, so they
        ask covert::audience(world, owner) instead: the owner plus every
        house that has already proved them, computed now and stamped once.
        A line's audience is therefore never re-widened; discovery reveals
        by writing NEW history — the revelation line, the lines the
        operation goes on to write, and the live projection — and the
        already-stamped owner-only lines stay exactly as they were. The
        three *_is_covert helpers now return the authored flag alone, and
        the semantic world view's covert field means the authored kind of
        work (so content keyed off it keeps recognising the same
        operation), with a separate world.exposures array carrying the
        records content reads.
        The card's own disclosure is authored: once the bound holder holds
        a record for the bound actor, the projection selects a second
        authored stage, adds the culprit organisation as a participant,
        links its head and the covert assignment itself, shows a proved-hand
        metric, drops the investigate action, and the lifecycle gains two
        further outcomes (struck-traced, weathered-traced) so the frozen
        sentence can name what is now known. The live-Order reading that
        decides struck versus weathered is untouched: proof is knowledge,
        never protection. The investigation is an ordinary assignment, so it
        may outlive the card that offered it — origin_situation is
        provenance, not a leash — and it resolves independently of the
        sabotage when both fall due together, in the existing stable
        ascending assignment-ID order with no coupling between them.
        Client-side, PanelData and PanelCtx carry the projected Exposure
        resource and the inspector's pursuing-line gate now calls
        covert::plan_named_to_viewer in aeon_sim: the client supplies the
        viewer and the projection, and owns no visibility rule of its own.
        This closes the exception the covert-provenance decision recorded.
      rationale:
        - "[ai] Reading the culprit from the lifecycle's own structural binding rather than from any selection is what makes the PRD's 'reveal the true culprit or nothing' a structural property: there is no candidate list, no confidence, and no field in which a false suspect could be authored, so the excluded false-attribution systems cannot arrive by accident."
        - "[ai] Exposure is per knower, not global, because the alternative publishes one house's investigation to every other house's ordinary surfaces the moment it succeeds; a bounded widening of the write-time audience (owner plus knowers) keeps the accepted stamped-once rule intact while still letting the discovering house read what it paid to learn."
        - "[ai] Keeping the world view's covert flag meaning the AUTHORED kind, and adding exposures beside it, avoids a trap: had covert flipped false on discovery, the Unquiet Holdings trigger would have stopped recognising its own operation and ended the card at the exact moment it should have started naming the hand."
        - "[ai] Resolving Expose in apply_effects_with_origin rather than in apply_effects is the only placement where the effect list and the originating occurrence are both in scope; apply_effects keeps its signature for events and popup answers and refuses the effect loudly there, which is also what makes the no-origin case testable."
        - "[ai] Splitting the two live-Order outcomes into traced and untraced pairs, instead of interpolating a culprit into one sentence, keeps the frozen resolution honest at both ends without teaching the resolution renderer anything about knowledge: it stays a pure authored-text choice made by an ordinary when_fn."
        - "[ai] The hostile-plan rumour gate is the one place a simulation-side surface knows its viewer, so it asks covert::is_exposed directly: a covert campaign still whispers nothing to a house that has not proved its owner, and resumes the ordinary coarse rumour for a house that has. That keeps the accepted rumour rule and the discovery rule from contradicting each other, and it is why the seam is a per-viewer question rather than a global flag."
        - "[ai] A leaderless investigate action reuses the visit slice's accepted machinery exactly — deterministic default preview, free picker, per-candidate authoritative forecasts — so comparing investigators costs no new client concept, and the client's only new input is the projected Exposure resource."
        - "[ai] The enquiry is kept an answer to the alarm rather than a free-standing order by a new AssignmentRequires predicate, target_under_covert_work — a live covert province-aimed assignment owned by somebody other than the orderer against the target province, whose owner the orderer has NOT yet proved (no Exposure record for that knower-and-culprit pair) — rather than by any Situation-only ordering rule. The predicate (covert::under_covert_work) is the simulation-side twin of the Unquiet Holdings card's read in full: the trigger's facts (live, covert, aimed at this province, owned by somebody other than the holder) narrowed by the projection's unquiet_hand_known, judged against the same authored flag and the same Exposure records the world view's exposures array carries, so the ordinary offer holds exactly while the card offers its own investigate action and withdraws with it. Situation actions are accepted as shortcuts into the ordinary assignment flow, so the one shared gate (button, forecast, command, AI, plan) is what stops trace-the-hand being purchasable on quiet ground where its effect could name nobody, and equally against a hand already proved while the operation still runs, where the card has dropped its action and there is nothing left to prove. The predicate is a mechanism in Rust and authored data in the requires block, and is refused loudly at load on a target kind that never names a province, exactly as the Order modifier is."
        - "[ai] An Expose fired where it can name nobody refuses through the string table (sim.covert.expose-refused), confided to the acting house and open to spectators and replay, never as public raw engine text — the same treatment log_diagnostic gives a Situation that cannot be evaluated. No ordinary order reaches it, by two rules that hold together. First, an ordinary trace-the-hand is offered, forecast open, and accepted only while unproved covert work runs against the province (the predicate above), which is exactly the window in which the Unquiet Holdings projection offers its investigate action; once the orderer has proved the hand, the ordinary offer withdraws with the card's action even though the operation and the card both remain live, the forecast reports BadTarget, and the command is refused at the shared gate. Second, an ordinary StartAssignment that a live, player-visible lifecycle's current projection offers at that exact target, with the leader unpinned or equal and in the same formal-war context, is started through start_assignment_from_situation and inherits that lifecycle's occurrence (situations::offering_lifecycle — the assignment_for_action match run the other way round, first match in structural-key order), so the province and household buttons place the very order the card's shortcut would have, origin included, and the forecast they quote stays authoritative for the command actually issued. The attach step changes no validation — the shared gate has already passed — and an order no live card offers starts without an origin exactly as before; for the enquiry the first rule guarantees that a live card offers it whenever the gate passes, so every ordinary enquiry attaches, which leaves events and popup answers as the only callers that can fire the effect outside a lifecycle."
      references:
        - covert-provenance-is-an-audience-on-authored-plans-and-assignments
        - the-vantar-operation-is-goal-and-plan-driven-not-scripted
        - assignment-effectiveness-may-read-live-provincial-order
        - casimirs-visit-is-a-windowed-hosted-situation
        - situation-actions-launch-authoritative-assignments

  - decision: reconciliation-abandons-uncommitted-hostility-through-authored-predicates
    core:
      status: accepted
      confidence: confirmed
      title: Reconciliation Abandons Uncommitted Hostility Through Authored Predicates
      summary: >-
        Changing a rival's live relationship derails only what is not yet
        committed, through data, and never erases a deed already
        underway. Three predicates join the shared PlanRequires
        vocabulary: min_target_head_opinion (the mirror of the hostility
        floor — the authority head's live regard for the target's head at
        or above the authored line; a missing head fails),
        target_owes_no_grievance (the sibling of target_owes_grievance:
        no open grievance the target owes the authority), and
        at_war_with_target (wars::active_war_between — the bilateral
        reading, whichever house declared). Two optional gates read that
        vocabulary. PlanDef.abandon_when is judged daily in advance_plans
        BEHIND the committed guard, so only a campaign with no step in
        flight can end on it, and a candidate on which it already holds is
        refused at adoption. GoalDef.set_aside_when is judged on the
        monthly pulse in advance_goals over the goal's frozen resolved
        target, with plans::requires_met rather than a second evaluator —
        trigger_met cannot see a target, so an ambition borrows the
        target-aware plan vocabulary instead of growing one — and is
        likewise refused at adoption. A goal set aside for lost grounds
        starts NO cooldown: the cooldown exists for exhaustion, the
        grounds may return, and an ambition whose grounds have returned
        is the house's again on an ordinary pulse. Both endings write
        distinct history (sim.plan.abandoned-no-grounds,
        sim.goal.set-aside-no-grounds); the existing method-gate recheck
        now writes the plan key too, because a gate that has ceased to
        hold before a new step is exactly lost grounds; every such line
        keeps the covert audience. No new snapshot section, but the
        persisted plan-requirement shape widened: an active plan copies
        each step's skip_if PlanRequires from the definition at adoption
        (the shipped ready-the-levies plan does exactly that), so the three
        predicates ride in CampaignState.plans and a version-21 snapshot
        holding one would no longer read. SNAPSHOT_FORMAT_VERSION is
        bumped to 22 (pre-release, no migration), and PlanRequires now
        carries serde(default) at struct level as a parse convenience only:
        a missing predicate reads as "do not care" so an older save reaches
        the version check and is refused cleanly rather than failing the
        parse. A predicate added later still changes the hashed serialised
        shape and must ride its own SNAPSHOT_FORMAT_VERSION bump, as this
        one did.
        The shipped content authors the accepted contract on
        undermine-a-neighbour and deniable-pressure. Hostile planning may
        begin at head-to-head regard -10 or lower or while a grievance is
        owed (unchanged). Regard above -10 suppresses new escalation: the
        method recheck starts no further step and lets an uncommitted
        campaign go. Regard at or above +20 with no grievance owed and no
        bilateral war lets the uncommitted campaign (abandon_when) and the
        ambition (set_aside_when) go. Both numbers are named Rhai
        functions (shadow_hostility_floor, shadow_reconciliation_line)
        shared by the goal selector, the plan gates, and the open card, so
        what the player reads is exactly what the AI weighs. Nothing new
        touches an assignment in flight or a war: the committed guard, the
        assignment rules (ending only on a dead leader, a concluded
        war-bound war, or cancellation), and the war rules (ending only by
        peace or collapse) already preserve them, and the scenario tests
        now lock that — an operation in flight at +20 resolves on its
        ordinary day through Unquiet Holdings, and a declared war keeps
        the ambition until peace is negotiated.
        Succession needs no new state and no protection either way: the
        dead head's plan ends by the dead-leader rule, the org-keyed goal
        and the org-level obligation ledger pass through untouched, the
        goal's frozen target is re-judged monthly against the successor's
        own regard, and — because lost grounds start no cooldown and plan
        cooldowns are keyed by actor — a hostile successor (Valka, at -20
        to Edrun after Perrin was reconciled) re-arms through ordinary
        adoption inside the window.
        The non-secret reasoning surface is A Cold Border (cold-border),
        an authored scenario Situation bound to the protagonist house and
        one cold neighbour: any standing organisation outside the chain of
        command holding a province that shares a surface route with a
        held one (world.routes, world.provinces), whose head regards the
        protagonist's head at or below the floor, or that is owed an open
        grievance by the protagonist. It reads the shared world view only
        — opinions, obligations, wars, organisations, provinces, routes —
        and never a plan, goal, assignment, or exposure record, so it
        cannot leak provenance by construction: it shows the live regard,
        the floor, the line, the open grievances owed, any bilateral war
        (days and a war link), and the neighbour's head as a link, and
        offers the two ordinary levers as actions — court pinned to the
        head (led by the head it lifts both the personal and the house
        regard) and the new send-gifts with a free envoy. It resolves
        passed-on, reconciled, or eased, with no effects: it explains why
        a neighbour might scheme, never that it is. Bound to the
        protagonist like its sibling First Reign cards but generic over
        neighbours, so two cards open the reign — Draksha's head regards
        Edrun at -20 as well as Vantar's at -15.
        The balance lever is authored: send-gifts (first-reign.rhai) is an
        ordinary consequential diplomacy assignment — 30 days, 20 wealth,
        difficulty 8, organisation target, ai_available false, a scandal
        risk — whose opinion effects carry their own reason (gifted +15 for
        1080 days on success, +25 for 1800 on a triumph; gift-spurned -10
        for 1440 on a disaster) toward the owner head. From the opening
        -15, a head-led court success (+20) plus a gifts success (+15)
        reaches the line exactly, and a court triumph (+40) reaches it
        alone: the line is a strategy of two ordinary successes, not one
        lucky roll. Grievance settlement is deferred: no authored effect
        settles a grievance (the obligation effect's fulfil action would
        work mechanically on a grievance record, but no settle assignment
        is authored), and grievances from exposed intrigue are permanent.
        The gating predicate reads target=debtor, authority=creditor —
        for Vantar's set_aside_when and abandon_when against Harrow, it
        asks whether HARROW owes VANTAR a grievance — and no shipped
        obligation has Harrow as debtor and Vantar as creditor, so the
        predicate holds and the +20 clause is reachable without a
        settlement. The ledger's only Vantar grievance runs the other way
        (okonn-resents-vantar: Vantar owes Okonn) and is irrelevant to
        this arc.
      rationale:
        - "[ai] Setting the goal aside over its frozen target is what actually ends the loop: the org-keyed ambition, resolved once at adoption and never re-judged, was the residue that kept pressing Subvert monthly after a reconciliation — the closest thing the simulation had to protected antagonist state. The plan-level abandon_when is belt and braces: in the shipped content the method recheck lets the campaign go first, but the predicate makes the +20 rule true of plans directly, for content whose gates carry no opinion floor."
        - "[ai] Reusing PlanRequires for set_aside_when keeps one relationship vocabulary, one evaluator, and one set of load rules (the organisation-target checks and the min-over-max band check apply to both), so an ambition and its campaigns cannot drift apart on what reconciliation means; GoalRequires stays target-blind, which is what its trigger needs."
        - "[ai] No cooldown on a lost-grounds set-aside is deliberate and asymmetric with exhaustion: a 720-day cooldown after reconciliation would have been protected peace, the mirror image of the protected antagonist the PRD forbids, and it would have made a hostile successor wait out the window. Oscillation needs a thirty-point swing (from at or above +20 back to at or below -10), so the pulse cannot thrash."
        - "[ai] Distinct history keys, rather than a reason threaded through abandon, keep the covert audience path untouched and make reconciliation-driven endings distinguishable in history without changing the existing plain-failure line; the method recheck joins the lost-grounds key because a gate that has ceased to hold before a new step means exactly that."
        - "[ai] The card reads the shared world view alone, so the covert boundary is structural rather than reviewed: nothing in its inputs can name a plan, a goal, an assignment, or a culprit. Binding it to the protagonist like the other First Reign cards keeps the deck focused, while walking every surface neighbour keeps it honest — Draksha's cold regard is a public fact too, and the tests select the Vantar card by both bindings."
        - "[ai] A second lever with its own opinion reason is the only way to stack: modifiers replace per (target, reason), so repeating court cannot climb, and without send-gifts the line was reachable only by a head-led critical courtship. Court stays the general answer; gifts are cheaper, shorter, and leader-free, so the picker compares envoys."
        - "[ai] The in-flight contract is a timing fact the tests pin: an accepted step resolves on its completes day, and only then — the same day — is the uncommitted residue let go; the ambition above it may be set aside on an earlier pulse without touching the work, because the goal owns no executor."
        - "[ai] The successor test is honest about what re-arms: the grand-goal roll is keyed by house and month, so the pinned seed's window pulse fires for Valka as it did for Perrin, and the ambition resolves to Harrow from her own regard; whether her campaign then mounts is her own agency roll, so the test holds the ambition, the target, and the absence of any inherited cooldown rather than scripting the operation."
      references:
        - the-vantar-operation-is-goal-and-plan-driven-not-scripted
        - covert-provenance-is-an-audience-on-authored-plans-and-assignments
        - investigation-proves-the-bound-culprit-through-durable-exposure-state
        - situation-actions-launch-authoritative-assignments
        - casimirs-visit-is-a-windowed-hosted-situation

  - decision: the-vantar-invasion-is-a-limited-formal-war-through-authored-plans
    core:
      status: accepted
      confidence: confirmed
      title: The Vantar Invasion Is a Limited Formal War Through Authored Plans
      summary: >-
        The first-year invasion arc is simulation-native content over the
        ordinary formal-war engine, with no scripted hostility, no war
        objective field, and no protected actor. An open, scenario-authored
        ambition (take-the-border, first-reign.rhai) is adoptable inside an
        authored window (min_campaign_day 260 to max_campaign_day 360) by a
        vassal head whose house passes a data capability floor (a levy in
        the field, 60 wealth, a pool of at least 400) and resolves its target through
        the existing hostile-border-neighbour selector at the shared -10
        floor with grievances counting; on the Ashkarr map that is Vantar
        against Harrow. It favours a new open AiIntent, invade, which the
        head-only scorer exposes exactly as the claim block does — naming
        no content key, and following the war's phase: aimed at the goal's
        organisation while the host is raised and the war declared, and at
        the exact bilateral war (wars::active_war_between) once one stands,
        so the campaigns that prosecute and settle it match on the war they
        are about. Four ordinary plans share the intent and hand the war
        from one to the next by target kind, each step through the shared
        validation gate: prepare-the-host (organisation target) musters a
        levy if the acting head commands none (the actor-bound
        leader_commands_army skip, read against the head's own post rather
        than any army the house fields, so a successor whose inherited levy
        still answers to the dead raises a fresh one) and then raises the
        host through raise-the-host, a closed assignment whose new
        reinforce-army effect grows the army the head commands by 350 (450
        on a triumph) from the house's pool — one person holds one command,
        so a head who generals the levy could never lead a second army
        mustered beside it, and the host is the levy at a war's strength —
        while the house's complete raised manpower is below the host's
        authored 800 (the new absolute max_branch_manpower reading);
        raise-the-host itself carries the new AssignmentRequires predicate
        leader_commands_army, so a leader with no command is refused at the
        start (NoCommand) and nothing is accepted, paid for, or logged;
        declare-the-border-war (organisation target) issues the ordinary
        seven-day declaration once the host stands at 800
        (min_branch_manpower), the house's raised manpower is at least the
        accepted three-quarters floor of the target's, and the house leads
        no war of its own; press-the-border (exact war
        target) sets respond/patrol standing orders on the strongest own
        army and starts one besiege aimed by a new step selector,
        lowest-enemy-border-province-in-war (the opposing side's most
        disordered holding sharing a surface route with a held one, lowest
        stable ID on a tie, marched by the actor's strongest own army), and
        then completes; settle-the-border (exact war target, cooldown 0)
        sues for peace through the ordinary negotiation whenever pressing
        is not available. "One holding" is therefore a property of the
        pressing plan — one siege step, a 360-day cooldown, and content-key
        order weighing pressing before settling — not of the war record,
        which keeps no objective: title transfer happens at siege success
        exactly as everywhere else, peace merely stops the fighting, and a
        lost holding stays lost until retaken through the same war. Both
        organisation-aimed plans carry the covert campaign's hostility
        method gates and its reconciliation abandon_when, and the ambition
        the same set_aside_when, so friendship derails what is uncommitted
        by the accepted #19 rules; succession, conquest, and a changed
        border derail through the selector and the existing dead-leader,
        fallen-target, and lost-grounds rules; depleted resources hold the
        preparation through the data floors.
        The engine grew reusable mechanisms and no gameplay constant:
        ScriptEffect::ReinforceArmy (soldiers and supplies from the owner's
        pool into the lowest-ID army the leader generals, clamped like
        form-army; the effect's own no-command arm is a guard, the rule is
        the start gate), AssignmentRequires.leader_commands_army and
        PlanRequires.leader_commands_army (one shared reading,
        assignments::commanded_army: the lowest stable army ID the character
        generals for the organisation, exactly as leader availability reads
        their post; the plan predicate is actor-bound, read through
        plans::requires_met_by against the plan's actor and, for an
        ambition with no actor, the house's head), PlanRequires.at_war (the
        unilateral reading — a war the authority leads a side of, having
        declared it or had it declared against it — beside the bilateral
        at_war_with_target; riding in a liege's war as a branch member is
        not the house's own war and does not count, because the first
        scan showed Vantar swept into a Veyrin war for the whole window),
        PlanRequires.min_branch_manpower / max_branch_manpower (the
        authority's complete raised manpower in absolute terms, the
        sibling of the permille comparison), PlanRequires.
        war_has_enemy_border_province (the geographic sibling of
        war_has_enemy_province, refused at load without an exact war
        target), PlanArmySelector::Strongest (most manpower among the
        armies the actor generals, lowest stable ID on a tie), and the
        border step selector above (refused at load without a war target,
        and matched to own-army-and-province assignments in the selector
        matrix). The new predicates (at_war, min/max_branch_manpower,
        war_has_enemy_border_province, leader_commands_army) widen the
        persisted plan requirement shape active plans carry in their step
        skip conditions, so SNAPSHOT_FORMAT_VERSION is bumped to 23
        (pre-release, no migration), as the snapshot rule requires.
        The ambition's horizon is authored to cover the whole chain it
        drives (border_war_horizon_days, 517 days: the four campaigns' work
        with their ordinary retries plus roughly two months' waiting on the
        agency pulse for each adoption), because the invade pressure exists
        only while the ambition stands and try_adopt considers only plans
        answering the top pressure — an ambition that lapsed after the
        declaration would leave a war with no siege and no peace overture;
        set_aside_when remains the friendship exit.
        Sides freeze at declaration as {Vantar} against {Harrow} by the
        existing partition rule; the common liege joins neither side unless
        it adopts one through the ordinary head-led adopt-formal-war
        assignment, and no content — no plan step, no scorer path — starts
        that for anyone, so "Veyrin receives no scripted rescue behaviour"
        is a structural fact the tests guard rather than code. Losing
        Vhorruk never ends the campaign: check_player_failure ends it only
        with no living member or no held province, and Harrow keeps three.
        The player's surface is War at the Border (border-war), an open
        First Reign Situation bound to the protagonist, the bordering enemy,
        the exact war, and the one holding exposed to it — the lowest-ID
        house-held province sharing a surface route with the neighbour's
        holdings, the same border the AI's selector walks — audience the
        house, a pausing announcement on activation, guidance rows, an
        assailed warning stage while an enemy force stands in or a
        war-bound enemy operation is aimed at the holding, live metrics
        (the holding and its Order, the largest own stack standing inside
        it, enemy soldiers on its ground, both sides' soldiers under arms,
        days of war), march-into-the-holding and negotiate actions, and
        outcomes passed-on, lost, ungoverned, peace, and held. Lost and
        ungoverned are both pure live-holder readings, split so the copy is
        true of the reading: lost is the neighbour holding the ground now,
        and ungoverned — weighed straight after it — is the remainder, a
        holding that is no longer the house's and not the neighbour's
        either. A besieged province that throws off its ruler under the
        strain of the war produces that, and so does ground taken by
        another belligerent on the enemy side, since a siege gives the
        title to whichever house took it; the ungoverned line therefore
        names no cause, so it stays true of both. It reads the shared world
        view alone. A holding that falls or is thrown off ends that
        lifecycle on record; whatever holding is exposed next opens its own
        lifecycle, so history reads as a chronicle of the border. It is bound to any war the house is a member of with a
        bordering enemy, whoever declared it, so the same card serves a war
        Harrow starts across the same border and the acceptance campaign's
        Draksha war.
        Balance is measured, not tuned. Layer one feeds the accepted
        engagement formula the arc's exact strategic inputs: the 800 host
        (the levy at its war strength) under Perrin's command of 6 stands
        at 1,040; Harrow's opening 600
        under Edrun's 7 on home ground at settled Order stands at 972 and
        loses the field in a clear majority of 500 sampled seeds while
        holding some; a thousand standing together stands at 1,620 and holds
        every sampled field, even against the 900 triumph host — the
        formula's truth on settled ground. Layer two is a campaign sample
        (tests/invasion.rs) of fresh hosts over the shipped content: the
        real raise-the-host assignment decides the host's size by its own
        roll (800 or 900), the real war is declared, the AI's own
        press-the-border plan runs its orders and siege, and Vhorruk's
        holder is tallied per seed
        across three honest defences — the Guard marched into Vhorruk (600),
        Aleyn's thousand as a house naturally reaches it (the Guard in
        Vhorruk plus a second stack of 400 elsewhere), and a thousand
        standing together in Vhorruk. What keeps a thousand from being a
        guarantee in general is the state the arc actually tests
        — only the largest stack inside the holding fights, so the split
        thousand is as dangerous as six hundred, while the concentrated,
        supplied thousand at settled Order holds every sampled field — and
        the sample asserts exactly that, alongside the
        one-holding limit (no siege ever aimed past the border) and the
        campaign continuing. Measured on the shipped content over seeds 1
        to 6 (hosts of 800 and 900 both drawn): Vhorruk fell in 3 of 6
        campaigns against the Guard alone in the holding, in 2 of 6 against
        the split thousand, and in 0 of 6 against a thousand standing
        together; the siege's own authored contest (difficulty 14 against
        Perrin's command of 6) is why an undefended or outmatched holding
        still holds in roughly half the campaigns. The pinned full-AI seed
        (3) adopts the ambition on the day-270 pulse, raises a 900 host by
        day 371, declares on day 428, has its siege of Vhorruk under way on
        day 481, sees that assault break on day 543, spends the pressing
        plan's one retry, takes up the settling campaign on day 750, and
        concludes the war in a negotiated peace on day 771 — every link
        probabilistic, none scripted. Vhorruk never changes hands on that
        seed, but two sieges leave it in unrest long enough to throw off
        its ruler, so its card ends ungoverned before the peace: a genuine
        loss to the defender that the neighbour did not win, which is the
        distinction the split outcome exists to keep honest.
      rationale:
        - "[ai] Reusing the shadows' selector, floor, line, and reconciliation predicates for the open arc means one relationship contract governs both halves of Vantar's first year: the same courtship that quiets the sabotage quiets the border, and the Cold Border card's numbers are the numbers the invasion weighs."
        - "[ai] The invade pressure follows the war's phase (organisation, then exact war) so that plans can keep the exact-war identity the formal-war decisions require — a war-targeted plan matches only the war it is about — without any plan needing to discover the war for itself, mirroring the claim block's claimant_war_blocker hand-off."
        - "[ai] Making one holding a property of the pressing plan (one siege step, a long cooldown, and content-key order that weighs pressing before settling) rather than adding an objective to WarRecord keeps the accepted war identity untouched: the war stays a frozen-sides ledger that peace merely stops, and the limit is authored, inspectable, and changeable in Rhai. After the holding falls the border moves to Tolmaz, and the cooldown is what keeps the ambition from following it."
        - "[ai] The host is the levy reinforced rather than a second army because the accepted single-source leader availability rule makes a general's standing command exclusive: the brief's design — the head musters a second army and leads it to Vhorruk — cannot start a siege at all (the head is posted to the levy and every order for another army is refused as already assigned), which the first scan and the diagnostic proved. A reinforce effect is the honest reading of the engine's one-person-one-command model, gives the arc its single 800 stack exactly as the balance brief assumed, and hands the player the same lever: the one ordinary way a single stack grows, since no order merges two."
        - "[ai] The unilateral at_war predicate is the honest third-party-war rule: a house already fighting a war of its own waits before opening a second front, whoever the enemy is, which the bilateral at_war_with_target cannot express. It reads side leadership rather than membership because the first scan showed Vantar riding in a Veyrin war for the whole window in most seeds where the ambition formed; a war the liege declared is not a war on the vassal's own hands, and counting it would have made the arc practically unreachable. Preparation is deliberately not gated on it — a house at war elsewhere may still arm."
        - "[ai] The absolute branch-manpower predicates exist because a house that reinforces to an authored strength needs to read its own strength, not a ratio: the permille comparison alone could not distinguish a levy short of its host from a host facing a strong neighbour. The declaration keeps the permille floor beside it at the accepted three-quarters so a neighbour more than a third stronger deters the war outright. The strongest army selector remains for a house that fields several forces under one head; the border selector bakes the same choice in so the siege and the doctrine agree on which force is the host."
        - "[ai] Splitting lost from ungoverned came out of making the pinned seed's resolution unconditional: with lost authored as the bare reading \"no longer the house's\", the seed's besieged, disordered Vhorruk revolted and the card told the player it had fallen to House Vantar, which never held it. The copy is the contract a pure live reading has to keep, so the reading is narrowed to the neighbour and the remainder gets its own outcome and its own line; the held fallback stays what it always was, the holding still the house's."
        - "[ai] The card binds the exposed holding by lowest stable ID rather than by the AI's lowest-Order rule because a structural key must not wobble with a daily number; on the authored map the two agree (Vhorruk is the one Harrow holding across the border), and where they would not, the metrics still name the holding under assault. The per-holding lifecycle is accepted as a chronicle: a fallen holding's lost resolution is durable, and the next exposed holding is a new fact worth its own card."
        - "[ai] Balance is asserted as the formula's truth rather than engineered: the engagement constants are pinned by the accepted strategic-engagement-formula decision and are not touched. A concentrated, supplied thousand at settled Order holding every sampled field (0 of 500 formula draws, 0 of 6 campaigns) is the honest reading, and the guidance, the GDD 01 story, and the GDD 05 acceptance bullet all say it in the same terms — a thousand is favourable, not a guarantee in general, because what makes it uncertain is Order, supply, splitting across stacks, and standing elsewhere, never the count alone; the danger to a house that has answered Aleyn is the split stack, the ground's Order, and a dry train, which is exactly the transferable lesson the onboarding programme asks for."
        - "[ai] The pinned full-AI seed in the scenario tests exercises the whole chain unaided — goal on a window pulse, host, declaration, siege — because every link is probabilistic (a 30% goal pulse, a 50% agency pulse, the muster's roll, the siege's own contest); separate scripted tests drive each boundary deterministically, the same testing posture the claim and shadow arcs take."
