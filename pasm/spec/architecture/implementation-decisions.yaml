        - m7-spectator-mode

  - decision: formal-wars-have-occurrence-stable-ledgers
    core:
      status: accepted
      confidence: confirmed
      title: Formal Wars Have Occurrence-Stable Persistent Ledgers
      summary: >-
        Each declaration allocates a WarId and records an authoritative
        WarRecord with cause, opening date, two nonempty disjoint sides, side
        leaders, ordered organisation members, adoption history, and optional
        conclusion date and reason. A guaranteed seven-day head-led assignment
        declares the war. Concluded records remain available for history,
        replay, and the Formal War Situation resolution. A war belongs to
        organisations and survives head succession, claimant death, and claim
        renunciation. This milestone adds no alliance, coalition, casus belli,
        front, war-score, surrender, or inactivity-peace system.
      rationale:
        - "[ai] Occurrence identity distinguishes repeated wars between the same organisations and lets assignments, blockades, logs, and resolutions name exactly the conflict they belong to."
        - Persisting concluded records makes a war's history authoritative rather than reconstructing it from display text.
      references:
        - formal-war-system
        - stable-game-identity
        - versioned-snapshots-plus-command-log
        - formal-wars-use-the-situation-surface

  - decision: war-sides-freeze-branches-with-explicit-liege-adoption
    core:
      status: accepted
      confidence: confirmed
      title: War Sides Freeze Realm Branches with Explicit Liege Adoption
      summary: >-
        Declaration recursively adds each leader's current transitive vassal
        branch. For an internal war, the descendant keeps its whole branch and
        that branch is excluded from the ancestor's side, supporting sibling,
        liege-vassal, and rebellion conflicts without overlap. Membership then
        stays frozen. A nonparticipating liege may use a guaranteed seven-day
        head-led adoption assignment to join the side containing its vassal,
        add its current branch except existing opponents, become side leader,
        and assume whole-war peace authority. There are no defections or
        separate settlements in this milestone.
      rationale:
        - "[ai] Snapshotting the declared branches makes war membership deterministic and legible even when peacetime liege relationships change mid-conflict."
        - Explicit adoption creates a visible escalation decision instead of making every overlord join automatically.
      references:
        - formal-war-system
        - legal-holdings-and-obligations
        - characters-are-the-acting-unit
        - situation-actions-launch-authoritative-assignments

  - decision: exact-war-identity-gates-hostility-and-operations
    core:
      status: accepted
      confidence: confirmed
      title: Exact War Identity Gates Hostility and Military Operations
      summary: >-
        AssignmentTarget gains War and forecasts, commands, active assignments,
        snapshots, and blockades carry an optional exact WarId. Siege and
        blockade require the owner and target holder to oppose one another in
        that active war at start and resolution; peace aborts assignments bound
        to it and clears its blockades while retaining territorial outcomes.
        The existing probabilistic twenty-day negotiation assignment settles
        the whole war and is authorised only for the current side leader.
        Standing orders, defenders, map hostility, occupation pressure, trade,
        and blockades ask shared war-side predicates. Raids remain deniable and
        create hostility only for that operation.
      rationale:
        - "[ai] Binding an operation to one occurrence prevents a peace followed by a new war between the same parties from reviving old orders or blockades."
        - Shared predicates keep the map, economy, defence automation, and assignment validation from disagreeing about who is an enemy.
      references:
        - formal-war-system
        - engine-owned-military-operations
        - standing-orders-fire-for-idle-armies
        - map-facts-are-simulation-answers

  - decision: claimant-war-blocks-paramount-press
    core:
      status: accepted
      confidence: confirmed
      title: A Live Rival-Claimant War Blocks Pressing the Paramountcy
      summary: >-
        The ninety-day press assignment revalidates its personal claim,
        vacancy, whole-realm dominance, and war state at start and completion.
        It cannot award the title while its claimant opposes another currently
        valid claimant in an active formal war. An unrelated war does not
        block; if the rival dies or renounces, their continuing organisation
        war stops blocking. A blocking war begun during the attempt causes the
        attempt to fail, while peace before completion permits success.
      rationale:
        - "[ai] A claimant should not settle the succession administratively while their right is still being fought by another live claimant."
        - Revalidation prevents a dead, dependent, renounced, or no-longer-dominant claimant from receiving a delayed title award.
      references:
        - province-count-paramountcy-claim
        - formal-war-system
        - paramountcy-is-personally-claimed-by-independent-heads

  - decision: autonomous-paramount-claimants-fight-through-authored-plans
    core:
      status: accepted
      confidence: confirmed
      title: Autonomous Paramount Claimants Declare and Fight through Authored Plans
      summary: >-
        An eligible independent head adopting the take-the-planet ambition may
        run the one-day declaration assignment before attaining dominance. A
        trailing claimant challenges the leading claimant only when its
        prospective war branch has at least seventy-five percent of the
        leader's raised army manpower. Authored plans then choose the
        lowest-order stable-ID enemy province, prosecute war through ordinary
        assignments and standing orders, negotiate when dominant or unable to
        continue, and press only after peace. Claim-war plans use zero cooldown
        so they may continue this deterministic loop while the ambition holds.
      rationale:
        - "[ai] The seventy-five-percent floor permits risky political wars without sending obviously hopeless branches into deterministic ruin."
        - Reusing goals, plans, assignments, and standing orders gives autonomous characters no privileged path through the new rules.
      references:
        - paramountcy-is-personally-claimed-by-independent-heads
        - formal-war-system
        - plans-are-authored-campaigns
        - standing-orders-are-priority-lists
        - intent-driven-organisation-agency

  - decision: situations-and-formal-wars-use-snapshot-18
    core:
      status: accepted
      confidence: confirmed
      title: Situations, Personal Claims, and Formal Wars Use Snapshot 18
      summary: >-
        Snapshot format 18 captures personal Paramount claims, active and
        concluded wars and adoption history, war-bound assignments and
        blockades, cancellation state, obligation source keys, active Situation
        lifecycles, resolution notices, diagnostic fingerprints, log Situation
