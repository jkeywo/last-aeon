        - situation-lifecycle-leaves-dismissible-resolutions
        - claimant-war-blocks-paramount-press

  - decision: script-host-is-the-fleets
    core:
      status: accepted
      confidence: confirmed
      title: The Sandbox Is Extracted; The Vocabulary Stays
      summary: >-
        The Rhai sandbox profile, the framed content hash, and the
        context-in call seam move to vellum-script, extracted from this
        game as the fleet's deterministic script host. What stays here is
        the vocabulary: which builder functions the loading engine
        registers, the shape of the context a call receives, and how a
        returned value becomes typed effects or another call-site-specific
        typed model — one game's content model,
        not a general mechanism. A pure extraction, proven rather than
        asserted: the content hash and every acceptance replay hash are
        byte-identical across the change.
      rationale:
        - >-
          The sandbox's value is in what it *refuses*, and every refusal has
          a reason that is easy to lose when the next game writes its own:
          building deny-by-default from a raw engine rather than stripping a
          full one, absent wall clock, dummy module resolver, disabled eval,
          hard limits, integer-only arithmetic. Those reasons are now
          written once, with tests that fail if a capability creeps back in.
      references:
        - deterministic-campaign-simulation
        - fleet-foundation-adoption

  - decision: client-owned-versioned-interface-preferences
    core:
      status: accepted
      confidence: confirmed
      title: Interface Scale and Density Persist Outside the Campaign
      summary: >-
        The client exposes 100%, 125%, 150%, and 200% whole-interface scale
        choices independently from Compact and Comfortable density. One
        versioned codec is stored under the operating system's stable per-user
        application configuration directory or the stable
        last-aeon.ui.preferences browser local-storage entry and fails softly
        to 100% Compact when it is missing, corrupt, inaccessible, or from an
        unsupported future version. Native filesystem and shared browser-shaped
        adapter contracts are tested through injectable backends, while Trunk
        supplies wasm compile coverage. Title and campaign surfaces edit the
        same resource. The preference resource remains in aeon_client and an
        isolation test proves it never changes commands, snapshots, or hashes.
      rationale:
        - "[ai] Separating scale from density lets a player enlarge the whole interface without making information disappear, while retaining the existing compact presentation as the default."
        - "[ai] A shared codec and platform-specific storage adapters give native and web the same contract without teaching the authoritative simulation about presentation state."
        - "[ai] Resolving native storage through per-user application configuration directories makes persistence independent of launch working directory while keeping read and write failures recoverable."
      references:
        - egui-with-owned-design-tokens
        - shared-native-and-web-delivery
        - headless-authoritative-simulation

  - decision: logical-point-responsive-campaign-shell
    core:
      status: accepted
      confidence: confirmed
      title: Campaign Chrome Reflows from One Shared Logical-Point Plan
      summary: >-
        The client computes one deterministic layout plan from the egui
        viewport after interface scale is applied. Spacious mode keeps a
        one-band top bar and columnar bottom dock. Below 1400 logical points
        wide or 640 points tall, Compact mode uses two wrapping top-bar bands
        and persistent tabs for bottom panels. Side and bottom docks are
        clamped as a group, ordinary panel content scrolls vertically, and
        floating search, attention, and assignment surfaces are constrained to
        the viewport. The presentation changes no commands or simulation data.
        A deterministic embedded-campaign fixture renders the complete
        production shell, including its docks, compact tabs, search and attention
        overlays, Situation panel, assignment popup, and forecast renderer. It
        uses one coherent per-tuple flow: real subject and time controls, the
        Situation action and its hover forecast, that action's shared assignment
        popup and Confirm, then the emitted StartSituationAssignment through the
        client command and elapsed-time seams until it naturally projects its
        resolution and tagged history. Passive production instrumentation checks
        full raw 24-point responses contained by their active clips and viewport
        for headers, compact tabs, search, attention, time, subject, action, and
        Confirm, plus vertical-only scroll geometry, materially visible clipped
        forecast/resolution/history galleys, and resolved panel/window contrast.
        Native tests and wasm-bindgen-test in headless Chrome execute every
        display-matrix tuple from the same harness.
      rationale:
        - "[ai] Planning in logical points makes interface scale part of the input and prevents native and web from drifting into target-specific responsive policies."
        - "[ai] Tabs preserve every bottom panel and command at short heights without forcing ordinary text into simultaneous horizontal and vertical scrolling."
        - "[ai] The shared production-path fixture plus headless Chrome execution gives repeatable native/web rendered-state evidence without pretending it is a pixel-perfect screenshot baseline."
      references:
        - egui-with-owned-design-tokens
        - client-owned-versioned-interface-preferences
        - shared-native-and-web-delivery
        - headless-authoritative-simulation

  - decision: rendered-order-keyboard-navigation
    core:
      status: accepted
      confidence: confirmed
      title: Keyboard Focus Follows the Rendered Responsive Surface
      summary: >-
        The client keeps keyboard policy entirely in presentation. Egui's
        registry is rebuilt from focusable response rectangles, paint layers,
        and explicit visual surface bands after responsive reflow. Tab and
        Shift+Tab traverse that sorted registry; arrow keys rove within visual groups.
        Enter and Space activate the ordinary widget response. Escape unwinds
        the nearest picker, assignment composition, settings, or search and
        restores its invoker. Situation subjects, actions, leader choices,
        custom icon controls, Confirm, and time controls expose a visible
        audited focus boundary. Focused forecast-bearing controls disclose the
        same authoritative forecast as hover. Neither focus nor navigation
        emits a PlayerCommand or advances the campaign clock.
      rationale:
        - "[ai] Deriving traversal from widgets that were actually rendered prevents compact reflow from creating a second, stale spatial model."
        - "[ai] Restoring the logical invoker makes Escape reversible even when a floating surface temporarily owns focus."
        - "[ai] Stable logical keys let reflow resolve a changed egui ID and choose an adjacent visible fallback when the original control disappears."
        - "[ai] Reusing normal activation, forecast, command, and clock paths keeps keyboard support presentation-only and headless-authoritative."
        - "[ai] Raw action capture occurs before a separate explicit registry step: rendered tests independently sort every captured enabled response and require an exact logical-ID match with the traversal registry, while a deliberately unregistered negative fixture proves omissions fail the audit."
        - "[ai] Situation repair is occurrence-scoped: an action carries occurrence and action identity, and only a newly created resolution for that same occurrence may receive focus after the action disappears."
        - "[ai] Escape uses one shared per-press claim before strategic view hotkeys, in picker, assignment, settings, then search order; the egui pass consumes a claimed event so one press closes exactly one local layer, while an unclaimed press retains the normal Body-to-System fallback."
        - "[ai] Settings stores the logical key of the real action that opened it and resolves that invoker, or the documented adjacent visible fallback, against the current rendered registry on Escape or visible close."
        - "[ai] Floating campaign surfaces omit egui's unregistered title-bar close response and provide localized captured Close or Cancel actions instead, making visible closure part of the exact Tab registry and the same logical-invoker restoration path as Escape."
      references:
        - logical-point-responsive-campaign-shell
        - egui-with-owned-design-tokens
        - shared-native-and-web-delivery

  - decision: core-explanations-are-owned-focusable-snapshots
    core:
      status: accepted
      confidence: confirmed
      title: Core Explanations Are Owned, Focusable Snapshots
      summary: >-
        The client gives consequential Situation actions and candidate
        comparisons an always-visible compact forecast summary plus a shared
        detail trigger. Pointer hover and keyboard focus render the same
        transient body from the same authoritative AssignmentForecast. Explicit
        pointer hover remains owned by the originating response so its popup
        cannot cover or displace that control; keyboard focus alone uses an
        explicit response-anchored tooltip with the identical body. Explicit
        activation of the separate Pin details control copies the title,
        summary, and forecast into one client-owned snapshot; it never activates
        the underlying action or emits a PlayerCommand. Every production source
        supplies a stable semantic logical key (Situation occurrence and action,
        candidate character, or assignment and surface), so identical display
        titles remain distinct controls and dismissal restores the exact
        invoker. The pinned window is
        constrained to the current viewport, wraps and scrolls vertically,
        survives selection changes, responsive reflow, and resolution of its
        source Situation, and is dismissed by its visible control or Escape.
        A client-owned per-press claim is established before ordinary Update
        navigation and consumed at the head of the later egui pass, preventing
        the same
        physical Escape from also changing map, popup, search, form, or command
        context; with no pinned snapshot, Escape falls through normally.
        Full forecast bodies write the meaning of duration and delay,
        guaranteed costs, contests and distributions, conditional risks,
        military-operation exclusions, recall limits, and authored outcomes
        directly into the layout rather than leaving those consequences in
        pointer-only tooltips.
        Native and headless-Chrome rendered-state tests exercise the same
        production widgets and verify focus without a pointer, pinning,
        persistence, geometry, dismissal, and command isolation.
      rationale:
        - "[ai] A copied presentation snapshot lets the player finish reading an explanation after its live source changes without retaining or mutating authoritative campaign state."
        - "[ai] Keeping action activation and explanation pinning on distinct focusable controls removes ambiguity for pointer, keyboard, and touch interaction."
        - "[ai] One renderer for hover, focus, and pinned help prevents explanatory meaning from drifting between access routes."
        - "[ai] Sharing one Escape claim across Bevy input and egui ordering gives pinned help semantic priority without teaching authoritative simulation state about UI events."
        - "[ai] A pinned or keyboard-focused forecast must be semantically complete on its own; retaining pointer-only definitions inside that body would merely move the accessibility boundary into the new help surface."
        - "[ai] Response-owned hover placement preserves the action's stable hover geometry, while limiting explicit tooltip construction to pointerless keyboard focus keeps both routes equivalent without making them mechanically identical."
        - "[ai] Display copy is localised and non-unique, so Pin traversal and focus restoration use caller-owned domain identity rather than titles; rendered duplicate-title coverage protects that boundary."
      references:
        - job-forecast-and-explanation-ui
        - forecasts-derive-from-shared-resolution-code
        - logical-point-responsive-campaign-shell
        - headless-authoritative-simulation

  - decision: situation-context-carries-activation-and-start-facts
    core:
      status: accepted
      confidence: confirmed
      title: Situation Contexts Carry Activation and Campaign-Start Dates
      summary: >-
        Every Situation script call context gains an `activated` field and
        the shared semantic world view gains `start_date`. Projection and
        outcome calls receive the exact instance's activation date; a
        trigger receives the oldest live activation for its definition and
        source — exact for single-instance Situations — or the unit value
        when nothing is active. Both values are copies of authoritative
        clock and lifecycle facts, so authored content can compute
        deadlines such as "seven days after activation" and one-shot
        opening-day gates without any Rust-side special case.
      rationale:
        - "[ai] Deadlines are gameplay values, so their arithmetic belongs in authored content; without the activation date in context, every dated demand would need a bespoke Rust rule."
        - "[ai] Giving triggers the oldest live activation rather than a per-instance date keeps the synthetic trigger context honest: bindings are the trigger's own output and cannot key a lookup before they exist."
        - "[ai] The start date makes 'the campaign's first day' expressible, which is what lets a scenario author a demand that activates exactly once and never reactivates after resolving."
      references:
        - situations-project-live-facts-into-authored-context
        - situation-instances-have-structural-identity
        - deterministic-campaign-simulation

  - decision: situation-outcomes-emit-owned-effects
    core:
      status: accepted
      confidence: confirmed
      title: Situation Outcomes May Emit Effects for a Bound Organisation
      summary: >-
        A Situation outcome may declare an `effects_fn` returning the same
        typed effect vocabulary assignment results use. Because a Situation
        has no leader or target, the definition names an `owner_binding` —
        a declared organisation binding — and validation refuses effects
        without one, an undeclared name, or a non-organisation kind. When
        the outcome resolves, the effects are parsed, resolved against
        roles seeded from that owner, applied once after the new lifecycle
        state is installed, and tagged with the exact Situation occurrence
        and audience. The vocabulary gains a `resources` effect applying
        exact signed wealth, manpower, supplies, and influence changes to
        the owner, verbatim: content owns the magnitudes, and a pool may go
        negative when an authored consequence says so.
      rationale:
        - "[ai] Situations previously only described; a deadline whose lapse costs the stated Influence needs a consequence path, and reusing the assignment effect boundary keeps scripts pure and the vocabulary single."
        - "[ai] An explicit validated owner binding stops a consequence from silently addressing nobody, which a role-vocabulary default would have allowed."
        - "[ai] Applying effects after state installation in resolution order keeps the day's evaluation deterministic and lets the resolution's own log line precede any effect logs."
        - "[ai] Exact-amount application is the contract the player was promised in advance; clamping would make the stated forfeit a lie at low pools."
      references:
        - situation-lifecycle-leaves-dismissible-resolutions
        - scripts-emit-validated-effects-only
        - situations-project-live-facts-into-authored-context
        - deterministic-campaign-simulation

  - decision: situation-activations-may-announce-through-popups
    core:
      status: accepted
      confidence: confirmed
      title: Situation Activations May Announce Through Ordinary Popups
      summary: >-
        A Situation definition may carry a table-decided activation
        announcement: when the row `situation.<id>.announcement` exists,
        each activation the current player may see pushes one ordinary
        pending popup carrying the announcement text, the definition key,
        a single acknowledgement choice, roles seeded from the owner
        binding, and the exact occurrence. The popup is authoritative
        popup state, so the client's existing popup auto-pause covers the
        activation and acknowledgement is an ordinary logged AnswerPopup
        command with no effects. Situation warnings keep the deliberately
        non-pausing attention model; only authored announcements pause.
      rationale:
        - "[ai] The day-one demand must interrupt, and the popup channel already owns deterministic pause-worthy interruptions with snapshot, replay, and answer semantics — a parallel pause path would drift."
        - "[ai] Table-decided prose follows the house rule that the row decides optional text, so an announcement cannot exist without its words or point at the wrong ones."
        - "[ai] Gating on authored visibility keeps a private house's demand from interrupting a rival player while remaining a pure function of authoritative state."
      references:
        - result-level-popups
        - situations-own-one-dock-and-attention-links
        - situation-instances-have-structural-identity
        - scripted-command-boundary

  - decision: the-court-awaits-is-an-ordinary-one-shot-demand
    core:
      status: accepted
      confidence: confirmed
      title: The Court Awaits Is an Ordinary One-Shot Scenario Demand
      summary: >-
        The Ashkarr scenario attaches The Court Awaits, a scenario-sourced
        Situation bound to House Harrow that activates exactly once, on the
        campaign's first day, and never reactivates. Its trigger counts an
        ordinary accepted assignment — owner is the bound house, started on
        or after activation and no later than activation plus the authored
        seven days — so acceptance, not completion, answers the court, and
        the deadline day itself still counts. Missing the window selects a
        lapsed outcome whose effects remove exactly the authored 10
        Influence, leaving a durable resolution and a playable campaign.
        Both numbers live in the scenario content; houses start with
        influence equal to authored legitimacy, so the forfeit is
        meaningful without new authored resources.
      rationale:
        - "[ai] Counting accepted work keeps the promise 'any valid command within seven days' honest even though every authored assignment outlasts the window."
        - "[ai] Satisfaction is checked before expiry so an order accepted on the deadline day answers the court, giving the boundary one deterministic reading."
        - "[ai] The start-date gate makes the demand one-shot without new snapshot state: after any resolution the trigger stays silent because the opening day never returns."
        - "[ai] The simulation rules exist identically with guidance on or off, which is what makes the equal-hash guarantee structural rather than tested-in."
      references:
        - situation-context-carries-activation-and-start-facts
        - situation-outcomes-emit-owned-effects
        - situation-activations-may-announce-through-popups
        - scripted-content-with-ci-validation

  - decision: first-reign-guidance-is-client-preference-prose
    core:
      status: accepted
      confidence: confirmed
      title: First Reign Guidance Is a Client Preference over Authored Prose
      summary: >-
        Scenario guidance is a default-on boolean in the client-owned
        versioned interface preferences, edited beside scale and density on
        the title and campaign settings surfaces. The stored document stays
        at version one: the added field defaults on when absent, so
        pre-guidance documents keep their meaning. Guidance prose is
        table-decided content on the Situation definition —
        `situation.<id>.guidance.objective`, `.how`, and `.why` — which the
        simulation never reads. When the preference is on, a guided card
        shows the objective plus "Show me how" and "Why this matters"
        triggers reusing the shared pinnable-explanation surface, whose
        topic now carries an optional forecast so prose-only help renders
        without inventing numbers. Guidance emits no commands, and the
        preference isolation proof covers it.
      rationale:
        - "[ai] Making guidance a preference rather than campaign state is what lets one campaign produce identical authoritative hashes with it on or off, and lets an expert disable it in one action before starting."
        - "[ai] Authoring guidance as definition prose keeps native and web byte-identical, keeps the orphan-row and missing-row audits covering it, and gives later guided Situations the same three rows to fill."
        - "[ai] Reusing the pinned-explanation surface keeps keyboard reach, focus restoration, and dismissal semantics identical to every other explanation instead of adding a tutorial-only widget."
      references:
        - client-owned-versioned-interface-preferences
        - core-explanations-are-owned-focusable-snapshots
        - the-court-awaits-is-an-ordinary-one-shot-demand
        - headless-authoritative-simulation

  - decision: situation-responses-are-recorded-occurrence-answers
    core:
      status: accepted
      confidence: confirmed
      title: Situation Responses Are Durable Occurrence-Keyed Answers
      summary: >-
        A Situation definition may declare pure responses — political
        answers with no assignment behind them, such as promising or
        refusing a demand. The player records one through a new
        AnswerSituation player command, validated and delayed like every
        other command; the accepted answer is stored on SituationState
        keyed by the exact occurrence (structural key plus activation
        date), snapshotted with the rest of Situation state, logged as
        tagged permanent history, and exposed to scripts as ctx.answer
        beside ctx.activated. The first recorded answer per occurrence is
        final; a reactivation or a requester replacement is a new
        occurrence and starts unanswered. Answers for ended lifecycles are
        pruned once their resolution has read them, so the map stays
        bounded. This amends the initial-deck rule that every gameplay
        action opens an assignment flow: recorded answers are the second
        Situation interaction kind, and they still mutate nothing directly
        — outcome predicates read them as authoritative state.
      rationale:
        - "[ai] Recording the answer on the occurrence rather than in a popup or a one-day assignment is what makes promise, refusal, and silence distinguishable months later at the deadline — popups delete on answer and completed assignments leave the live world view."
        - "[ai] First-answer-final with re-validation at delayed application keeps two same-day answers deterministic: the earlier envelope wins and the later one drops exactly as other stale commands do."
        - "[ai] Threading ctx.answer through trigger, projection, and outcome calls keeps the whole lifecycle a pure function of authoritative state, so save, replay, and equal-hash guarantees need no new machinery."
        - "[ai] The answers map changes CampaignState's serialised shape, so it rode a SNAPSHOT_FORMAT_VERSION bump to 20 — pre-release, no migration."
      references:
        - situation-actions-launch-authoritative-assignments
        - situation-instances-have-structural-identity
        - versioned-snapshots-plus-command-log
        - scripted-command-boundary

  - decision: situation-effects-may-address-a-bound-subject
    core:
      status: accepted
      confidence: confirmed
      title: Situation Outcome Effects May Address a Bound Character Subject
      summary: >-
        A Situation definition may declare a subject_binding naming one of
        its declared character bindings. When an outcome's effects or an
        activation announcement resolve their roles, the bound character
        seeds the existing `target` effect role beside the owner binding's
        organisation, through the one shared role resolver. Content can
        therefore write directional personal consequences — the requester's
        opinion of the owner's head — without widening the seven-role
        effect vocabulary or teaching Rust who a requester is. Validation
        requires the binding to be declared and character-typed.
      rationale:
        - "[ai] Reusing the target role through RoleSeed keeps the effect vocabulary closed and the resolver single-sourced, instead of inventing a Situation-only role name."
        - "[ai] Without a character seam, situation outcome effects could only address organisation-derived roles, and a household demand's personal consequence would silently address nobody."
      references:
        - situation-outcomes-emit-owned-effects
        - situation-activations-may-announce-through-popups
        - scripted-command-boundary

  - decision: household-demands-are-live-state-predicates-on-a-shared-anchor
    core:
      status: accepted
      confidence: confirmed
      title: Household Demands Are Live-State Predicates on One Shared Anchor
      summary: >-
        Kessarin's Order is the household-demand exemplar. Its goal is a
        pure live-state predicate — every Harrow-held province at or above
        the authored 850 Order — recomputed from current holders and Order,
        never from assignment starts or interface interaction. All three
        demands share one deadline derived from pure campaign facts:
        world.start_date plus the authored court window plus the authored
        120-day household window, so the anchor never depends on when the
        court was actually answered or on per-definition activation
        quirks. A demand activates once the court's test is behind the
        reign, resolves the first settled day its goal holds (achievement
        wins over any recorded answer, refusal included), and otherwise
        resolves on the deadline day by tiers: refusal -5/1,080, broken
        promise -20/1,800, silence -10/1,440, achievement +10/1,440 —
        each tier a distinct stable opinion reason from the bound
        requester toward the owner's head, with every magnitude authored
        in scenario content. A requester who dies or is replaced before
        the deadline ends the lifecycle with a no-effect passed-on
        outcome, and the authored pure replacement rule (the named family
        member, else the first living adult non-head member in stable ID
        order) binds the successor's new lifecycle. If an achieved goal
        later slips below target inside the shared window, the household
        may raise the demand again as a new unanswered lifecycle; opinion
        modifiers replace by (target, reason), so tiers never stack.
      rationale:
        - "[ai] Anchoring the shared deadline to start_date keeps issues 13 and 14 attachable without coordination state: each demand computes the same date from the same pure facts."
        - "[ai] Resolving at first achievement makes completion historical — the notice, the opinion tier, and the log survive while provincial Order keeps moving normally — rather than freezing a checkbox until the deadline."
        - "[ai] Achievement overriding refusal follows the accepted rule that achieving a goal satisfies it whether or not the player promised; a promise (or refusal) changes only the consequence of failure."
        - "[ai] The passed-on outcome keeps death from converting into a silence penalty from a dead requester, while the deterministic successor rule keeps trigger and projection in exact agreement."
      references:
        - situation-responses-are-recorded-occurrence-answers
        - situation-effects-may-address-a-bound-subject
        - the-court-awaits-is-an-ordinary-one-shot-demand
        - situation-context-carries-activation-and-start-facts
