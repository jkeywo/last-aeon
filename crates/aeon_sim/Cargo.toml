[package]
name = "aeon_sim"
description = "Headless authoritative simulation: ECS components, systems, command resolution, and persistence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aeon_core = { workspace = true }
aeon_data = { workspace = true }
bevy = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }

# The headless host, the test suites, and the acceptance tool fan Situation
# stages out across cores; the web target keeps the inline pool on the same
# code.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }

[lints]
workspace = true

[dev-dependencies]
# System debug names are read by the perf probe's per-system table.
bevy = { workspace = true, features = ["debug"] }
